<!DOCTYPE html>
<html lang="ru" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👥 Управление пользователями | Виртуальный музей</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            200: '#bfdbfe',
                            300: '#93c5fd',
                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a',
                        }
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.3s ease-out',
                        'slide-up': 'slideUp 0.3s ease-out',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        
        /* Smooth transitions */
        * {
            transition-property: background-color, border-color, color, fill, stroke, opacity, box-shadow, transform;
            transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
            transition-duration: 200ms;
        }
        
        /* Glass morphism */
        .glass {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
        
        .dark .glass {
            background: rgba(31, 41, 55, 0.5);
            border: 1px solid rgba(55, 65, 81, 0.5);
        }
        
        /* Button hover lift */
        .btn-hover-lift:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }
        
        /* Table row hover */
        tr.hover-effect:hover {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.06), rgba(139, 92, 246, 0.06));
            transform: translateY(-2px);
        }
        
        /* Focus ring */
        .focus-ring:focus {
            outline: none;
            box-shadow: 0 0 0 2px #3b82f6;
            border-color: #3b82f6;
        }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 4px;
        }
        .dark ::-webkit-scrollbar-track {
            background: #374151;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #6b7280;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-primary-500 via-primary-600 to-purple-700 dark:from-gray-900 dark:via-gray-800 dark:to-gray-900 min-h-screen p-4 lg:p-8">
    <div class="max-w-7xl mx-auto">
        <!-- Header -->
        <div class="glass rounded-2xl p-6 lg:p-8 mb-6 lg:mb-8 text-center animate-fade-in">
            <h1 class="text-2xl lg:text-3xl font-extrabold text-white mb-2">
                <i class="bi bi-people me-2"></i>Управление пользователями
            </h1>
            <p class="text-white/70 font-medium">Полный контроль над пользователями, ролями и доступами</p>
        </div>

        <!-- Back buttons -->
        <div class="flex flex-wrap gap-3 mb-6">
            <a href="{{ root }}/" class="btn-hover-lift inline-flex items-center gap-2 px-5 py-3 bg-white/20 hover:bg-white/30 text-white font-semibold rounded-xl transition-all backdrop-blur-sm">
                <i class="bi bi-arrow-left"></i>
                <span>На главную</span>
            </a>
        </div>

        <!-- Users section -->
        <div class="glass rounded-2xl p-6 lg:p-8 animate-slide-up">
            <!-- Title and stats row -->
            <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4 mb-6">
                <h3 class="text-xl font-bold text-white flex items-center gap-2">
                    <i class="bi bi-list-ul"></i>Список пользователей
                </h3>
                <div class="flex flex-wrap gap-3" id="statsRow">
                    <!-- Stats will be filled by JS -->
                </div>
            </div>

            <!-- Search -->
            <div class="relative mb-6">
                <i class="bi bi-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                <input type="text" id="searchInput" 
                    class="w-full pl-12 pr-4 py-3 rounded-xl bg-white dark:bg-gray-700 border border-gray-200 dark:border-gray-600 text-gray-800 dark:text-white focus-ring transition-all"
                    placeholder="🔍 Поиск по имени или email...">
            </div>

            <!-- Table container -->
            <div id="usersTableContainer" class="overflow-x-auto">
                <table class="w-full" id="usersTable">
                    <thead>
                        <tr class="bg-gradient-to-r from-primary-600 to-purple-600 text-white">
                            <th class="px-4 py-3 text-left text-sm font-semibold uppercase tracking-wider rounded-tl-xl">
                                <i class="bi bi-person-circle me-1"></i>Пользователь
                            </th>
                            <th class="px-4 py-3 text-left text-sm font-semibold uppercase tracking-wider">
                                <i class="bi bi-envelope me-1"></i>Email
                            </th>
                            <th class="px-4 py-3 text-left text-sm font-semibold uppercase tracking-wider">
                                <i class="bi bi-person-badge me-1"></i>Роль
                            </th>
                            <th class="px-4 py-3 text-left text-sm font-semibold uppercase tracking-wider rounded-tr-xl">
                                <i class="bi bi-gear me-1"></i>Действия
                            </th>
                        </tr>
                    </thead>
                    <tbody id="usersTbody" class="bg-white dark:bg-gray-800 divide-y divide-gray-100 dark:divide-gray-700">
                    </tbody>
                </table>
            </div>

            <!-- Empty state -->
            <div id="emptyState" class="hidden text-center py-16">
                <i class="bi bi-people-slash text-6xl text-gray-300 dark:text-gray-600 mb-4"></i>
                <h4 class="text-xl font-semibold text-gray-600 dark:text-gray-400 mb-2">Пользователи не найдены</h4>
                <p class="text-gray-500 dark:text-gray-500">В системе пока нет пользователей или они соответствуют вашему поисковому запросу</p>
            </div>
        </div>
    </div>

    <script>
        const ROOT = '{{ root }}';
        let allUsers = [];
        let allRoles = [];
        let filteredUsers = [];

        // Theme Toggle
        const html = document.documentElement;
        const savedTheme = localStorage.getItem('theme');
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        
        if (savedTheme === 'dark' || (!savedTheme && systemPrefersDark)) {
            html.classList.add('dark');
        }

        // Load data
        async function loadData() {
            try {
                const [usersRes, rolesRes] = await Promise.all([
                    fetch(ROOT + '/api/users'),
                    fetch(ROOT + '/api/roles')
                ]);
                
                allUsers = await usersRes.json();
                allRoles = await rolesRes.json();
                
                filteredUsers = [...allUsers];
                renderUsers();
                renderStats();
                setupSearch();
            } catch (error) {
                console.error('Ошибка загрузки:', error);
                alert('Ошибка загрузки данных');
            }
        }

        // Render users
        function renderUsers() {
            const tbody = document.getElementById('usersTbody');
            const emptyState = document.getElementById('emptyState');
            const tableContainer = document.getElementById('usersTableContainer');
            
            if (filteredUsers.length === 0) {
                tbody.innerHTML = '';
                tableContainer.classList.add('hidden');
                emptyState.classList.remove('hidden');
                return;
            }

            tableContainer.classList.remove('hidden');
            emptyState.classList.add('hidden');
            
            tbody.innerHTML = filteredUsers.map(user => {
                const roleColorClass = user.role === 'Администратор' ? 'bg-gradient-to-r from-emerald-500 to-green-600' : 
                                      user.role === 'Модератор' ? 'bg-gradient-to-r from-amber-500 to-orange-600' : 
                                      user.role === 'Редактор' ? 'bg-gradient-to-r from-violet-500 to-purple-600' : 
                                      user.role === 'Сотрудник' ? 'bg-gradient-to-r from-gray-500 to-gray-600' : 
                                      'bg-gray-200 dark:bg-gray-700 text-gray-600 dark:text-gray-400';
                
                return `
                    <tr class="hover-effect transition-all">
                        <td class="px-4 py-4">
                            <div class="flex items-center">
                                <div class="w-12 h-12 rounded-full bg-gradient-to-br from-primary-500 to-purple-600 flex items-center justify-center text-white font-bold text-lg mr-4">
                                    ${(user.name || '').charAt(0).toUpperCase()}
                                </div>
                                <div>
                                    <h6 class="font-semibold text-gray-800 dark:text-white">${user.name || 'Без имени'}</h6>
                                    <small class="text-gray-500 dark:text-gray-400">${formatDate(user.created_at)}</small>
                                </div>
                            </div>
                        </td>
                        <td class="px-4 py-4 text-gray-600 dark:text-gray-300">${user.email}</td>
                        <td class="px-4 py-4">
                            <span class="px-3 py-1 rounded-full text-xs font-semibold text-white ${roleColorClass}">
                                ${user.role || 'Без роли'}
                            </span>
                        </td>
                        <td class="px-4 py-4">
                            <select class="role-select px-3 py-2 rounded-lg bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 text-gray-800 dark:text-white text-sm focus-ring" data-user="${user.id}">
                                <option value="">Без роли</option>
                                ${allRoles.map(role => 
                                  `<option value="${role.name}" ${user.role === role.name ? 'selected' : ''}>
                                    ${role.name}
                                  </option>`
                                ).join('')}
                            </select>
                        </td>
                        <td class="px-4 py-4">
                            <button class="save-btn btn-hover-lift px-4 py-2 bg-primary-500 hover:bg-primary-600 text-white text-sm font-semibold rounded-lg transition-all" data-user="${user.id}">
                                <i class="bi bi-check-lg"></i> Сохранить
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');

            setupEventListeners();
        }

        // Stats
        function renderStats() {
            const adminCount = allUsers.filter(u => u.role === 'Администратор').length;
            const totalCount = allUsers.length;
            
            document.getElementById('statsRow').innerHTML = `
                <div class="px-4 py-2 rounded-xl bg-white/20 backdrop-blur-sm text-white">
                    <span class="font-semibold">${totalCount}</span>
                    <span class="text-white/70 text-sm ml-1">всего</span>
                </div>
                <div class="px-4 py-2 rounded-xl bg-emerald-500/30 backdrop-blur-sm text-white">
                    <span class="font-semibold">${adminCount}</span>
                    <span class="text-white/70 text-sm ml-1">админов</span>
                </div>
                <div class="px-4 py-2 rounded-xl bg-gray-500/30 backdrop-blur-sm text-white">
                    <span class="font-semibold">${allUsers.filter(u => !u.role).length}</span>
                    <span class="text-white/70 text-sm ml-1">без роли</span>
                </div>
            `;
        }

        // Search
        function setupSearch() {
            document.getElementById('searchInput').addEventListener('input', (e) => {
                const query = e.target.value.toLowerCase();
                filteredUsers = allUsers.filter(user => 
                    (user.name && user.name.toLowerCase().includes(query)) || 
                    (user.email && user.email.toLowerCase().includes(query))
                );
                renderUsers();
                setupEventListeners();
            });
        }

        // Event listeners
        function setupEventListeners() {
            document.querySelectorAll('.save-btn').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const userId = btn.dataset.user;
                    const select = document.querySelector(`.role-select[data-user="${userId}"]`);
                    const roleName = select.value;
                    
                    btn.disabled = true;
                    btn.innerHTML = '<i class="bi bi-arrow-repeat animate-spin"></i> Сохранение...';

                    try {
                        const res = await fetch(ROOT + `/api/users/${userId}/role`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ role: roleName })
                        });
                        
                        if (res.ok) {
                            alert('✅ Роль успешно обновлена!');
                            loadData();
                        } else {
                            const err = await res.json();
                            alert(`❌ ${err.error || 'Ошибка обновления роли'}`);
                            btn.disabled = false;
                            btn.innerHTML = '<i class="bi bi-check-lg"></i> Сохранить';
                        }
                    } catch (error) {
                        alert('❌ Ошибка сети');
                        btn.disabled = false;
                        btn.innerHTML = '<i class="bi bi-check-lg"></i> Сохранить';
                    }
                });
            });
        }

        // Format date
        function formatDate(dateStr) {
            if (!dateStr) return 'Недавно';
            return new Date(dateStr).toLocaleDateString('ru-RU', {
                year: 'numeric',
                month: 'short',
                day: 'numeric'
            });
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
