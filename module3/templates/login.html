<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Вход — Астрахань. Живая История</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/astra.css') }}">
</head>
<body class="astra-app">
<div class="login-page">
    <div class="login-box">
        <h1>Вход</h1>
        <p class="subtitle">Астрахань. Живая История</p>

        <div id="msg" class="login-error m3-hidden" role="alert" aria-live="polite"></div>

        <form id="loginForm" novalidate>
            <div class="form-group">
                <label for="username">Логин</label>
                <input id="username" name="username" type="text" class="form-control" autocomplete="username" required autofocus />
            </div>
            <div class="form-group">
                <label for="password">Пароль</label>
                <input id="password" name="password" type="password" class="form-control" autocomplete="current-password" required />
            </div>
            <button type="submit" class="btn btn-primary">Войти</button>
        </form>

        <p style="margin-top:1.25rem;text-align:center;font-size:0.85rem;color:var(--gray-400);">
            Нет аккаунта? <a href="{{ root }}/register" style="color:var(--accent);text-decoration:underline;">Регистрация</a>
        </p>
    </div>
</div>
<style>.m3-hidden{display:none!important}</style>
<script>
    const ROOT = '{{ root }}';
    document.getElementById('loginForm').addEventListener('submit', async function (e) {
        e.preventDefault();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();
        const msg = document.getElementById('msg');
        msg.classList.add('m3-hidden');
        if (!username || !password) {
            msg.textContent = 'Заполните логин и пароль.';
            msg.classList.remove('m3-hidden');
            return;
        }
        msg.textContent = 'Выполняется вход…';
        msg.className = 'login-error';
        msg.classList.remove('m3-hidden');
        try {
            const res = await fetch(ROOT + '/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json().catch(function () { return {}; });
            if (!res.ok) {
                msg.textContent = (data.error || 'Ошибка входа') + ' Проверьте данные и попробуйте снова.';
                msg.className = 'login-error';
                return;
            }
            msg.textContent = 'Успешно. Переход…';
            msg.className = 'login-logout';
            setTimeout(function () { window.location.href = ROOT + '/'; }, 400);
        } catch (err) {
            msg.textContent = 'Нет соединения с сервером. Проверьте сеть и обновите страницу.';
            msg.className = 'login-error';
        }
    });
    document.getElementById('password').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') document.getElementById('loginForm').requestSubmit();
    });
</script>
</body>
</html>
