{% extends "layout_dashboard.html" %}
{% block title %}Роли{% endblock %}
{% block content %}
<div class="m3-page-head">
    <h1><i class="bi bi-person-badge" aria-hidden="true"></i> Управление ролями</h1>
    <p>Создание и удаление ролей доступа.</p>
</div>

<a href="{{ root }}/" class="btn btn-ghost btn-sm" style="margin-bottom:1.25rem;"><i class="bi bi-arrow-left" aria-hidden="true"></i> На главную</a>

<div class="card" style="margin-bottom:1.25rem;">
    <div class="card-header"><h3>Новая роль</h3></div>
    <div class="form-row" style="grid-template-columns:1fr auto;align-items:end;gap:1rem;">
        <div class="form-group" style="margin-bottom:0;">
            <label for="newRoleName">Название</label>
            <input type="text" id="newRoleName" class="form-control" placeholder="Например: Модератор" autocomplete="off">
        </div>
        <button type="button" id="addRoleBtn" class="btn btn-accent"><i class="bi bi-plus-lg" aria-hidden="true"></i> Создать</button>
    </div>
</div>

<div class="card">
    <div class="card-header" style="justify-content:space-between;">
        <h3>Роли</h3>
        <span id="rolesCount" class="tag">0</span>
    </div>
    <div class="table-responsive" id="rolesTableContainer">
        <table id="rolesTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Название</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody id="rolesTbody"></tbody>
        </table>
    </div>
    <div id="emptyState" class="m3-hidden" style="text-align:center;padding:2rem;color:var(--gray-400);">
        <i class="bi bi-person-x" style="font-size:2.5rem;opacity:0.5;" aria-hidden="true"></i>
        <p style="margin-top:0.75rem;">Ролей пока нет — создайте первую выше.</p>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
const ROOT = '{{ root }}';
let roles = [];

async function loadRoles() {
    try {
        const res = await fetch(ROOT + '/api/roles');
        roles = await res.json();
        renderRoles();
        updateStats();
    } catch (error) {
        console.error(error);
        alert('Не удалось загрузить роли.');
    }
}

function renderRoles() {
    const tbody = document.getElementById('rolesTbody');
    const emptyState = document.getElementById('emptyState');
    const tableContainer = document.getElementById('rolesTableContainer');
    if (roles.length === 0) {
        tbody.innerHTML = '';
        tableContainer.classList.add('m3-hidden');
        emptyState.classList.remove('m3-hidden');
        return;
    }
    tableContainer.classList.remove('m3-hidden');
    emptyState.classList.add('m3-hidden');
    tbody.innerHTML = roles.map(function (role) {
        var perm = role.permissions ? Object.keys(role.permissions).filter(function (k) { return role.permissions[k]; }).join(', ') : '';
        return '<tr>' +
            '<td><span class="tag">#' + role.id + '</span></td>' +
            '<td><strong style="color:var(--cream);">' + role.name + '</strong>' + (perm ? '<br><span class="text-mono" style="font-size:0.7rem;color:var(--gray-500);">Права: ' + perm + '</span>' : '') + '</td>' +
            '<td><button type="button" class="btn btn-danger btn-sm delete-btn" data-id="' + role.id + '"><i class="bi bi-trash" aria-hidden="true"></i> Удалить</button></td>' +
            '</tr>';
    }).join('');

    document.querySelectorAll('.delete-btn').forEach(function (btn) {
        btn.addEventListener('click', async function () {
            var row = btn.closest('tr');
            var nameEl = row.querySelector('strong');
            var roleName = nameEl ? nameEl.textContent : '';
            if (!confirm('Удалить роль «' + roleName + '»?')) return;
            var id = btn.getAttribute('data-id');
            try {
                const res = await fetch(ROOT + '/api/roles/' + id, { method: 'DELETE' });
                if (res.ok) {
                    alert('Роль удалена.');
                    loadRoles();
                } else {
                    const err = await res.json().catch(function () { return {}; });
                    alert((err.error || 'Ошибка удаления') + ' Возможно, роль назначена пользователям.');
                }
            } catch (_) {
                alert('Ошибка сети.');
            }
        });
    });
}

function updateStats() {
    document.getElementById('rolesCount').textContent = roles.length + ' ролей';
}

document.getElementById('addRoleBtn').addEventListener('click', async function () {
    var name = document.getElementById('newRoleName').value.trim();
    if (!name) {
        alert('Введите название роли.');
        return;
    }
    try {
        const res = await fetch(ROOT + '/api/roles', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: name })
        });
        if (res.ok) {
            document.getElementById('newRoleName').value = '';
            loadRoles();
        } else {
            const err = await res.json().catch(function () { return {}; });
            alert((err.error || 'Не удалось создать роль') + ' Попробуйте другое имя.');
        }
    } catch (_) {
        alert('Ошибка сети.');
    }
});

document.getElementById('newRoleName').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') document.getElementById('addRoleBtn').click();
});

document.addEventListener('DOMContentLoaded', loadRoles);
</script>
{% endblock %}
