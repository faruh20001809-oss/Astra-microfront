<!DOCTYPE html>
<html lang="ru" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👑 Управление ролями | Виртуальный музей</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            200: '#bfdbfe',
                            300: '#93c5fd',
                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a',
                        }
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.3s ease-out',
                        'slide-up': 'slideUp 0.3s ease-out',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        
        /* Smooth transitions */
        * {
            transition-property: background-color, border-color, color, fill, stroke, opacity, box-shadow, transform;
            transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
            transition-duration: 200ms;
        }
        
        /* Glass morphism */
        .glass {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
        
        .dark .glass {
            background: rgba(31, 41, 55, 0.5);
            border: 1px solid rgba(55, 65, 81, 0.5);
        }
        
        /* Button hover lift */
        .btn-hover-lift:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }
        
        /* Table row hover */
        tr.hover-effect:hover {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.06), rgba(139, 92, 246, 0.06));
            transform: scale(1.01);
        }
        
        /* Focus ring */
        .focus-ring:focus {
            outline: none;
            box-shadow: 0 0 0 2px #3b82f6;
            border-color: #3b82f6;
        }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 4px;
        }
        .dark ::-webkit-scrollbar-track {
            background: #374151;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #6b7280;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-primary-500 via-primary-600 to-purple-700 dark:from-gray-900 dark:via-gray-800 dark:to-gray-900 min-h-screen p-4 lg:p-8">
    <div class="max-w-5xl mx-auto">
        <!-- Header -->
        <div class="glass rounded-2xl p-6 lg:p-8 mb-6 lg:mb-8 text-center animate-fade-in">
            <h1 class="text-2xl lg:text-3xl font-extrabold text-white mb-2">
                <i class="bi bi-person-badge me-2"></i>Управление ролями
            </h1>
            <p class="text-white/70 font-medium">Создавайте, редактируйте и управляйте правами доступа пользователей</p>
        </div>

        <!-- Back button -->
        <div class="mb-6">
            <a href="{{ root }}/" class="btn-hover-lift inline-flex items-center gap-2 px-5 py-3 bg-white/20 hover:bg-white/30 text-white font-semibold rounded-xl transition-all backdrop-blur-sm">
                <i class="bi bi-arrow-left"></i>
                <span>На главную</span>
            </a>
        </div>

        <!-- Add role form -->
        <div class="glass rounded-2xl p-6 lg:p-8 mb-6 animate-slide-up">
            <h3 class="text-xl font-bold text-white mb-4 flex items-center gap-2">
                <i class="bi bi-plus-circle text-emerald-400"></i>Добавить новую роль
            </h3>
            <div class="flex flex-col md:flex-row gap-4 items-end">
                <div class="flex-1 w-full">
                    <input type="text" id="newRoleName" 
                        class="w-full px-4 py-3 rounded-xl bg-white dark:bg-gray-700 border border-gray-200 dark:border-gray-600 text-gray-800 dark:text-white focus-ring transition-all"
                        placeholder="Введите название роли (например: 'Менеджер', 'Гость')">
                </div>
                <button id="addRoleBtn" class="btn-hover-lift px-6 py-3 bg-gradient-to-r from-emerald-500 to-green-600 hover:from-emerald-600 hover:to-green-700 text-white font-semibold rounded-xl transition-all shadow-lg w-full md:w-auto">
                    <i class="bi bi-plus-lg me-2"></i>Создать роль
                </button>
            </div>
        </div>

        <!-- Roles table -->
        <div class="glass rounded-2xl p-6 lg:p-8 animate-slide-up">
            <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-6">
                <h3 class="text-xl font-bold text-white flex items-center gap-2">
                    <i class="bi bi-list-ul"></i>Существующие роли
                </h3>
                <span class="px-4 py-2 rounded-xl bg-emerald-500/30 backdrop-blur-sm text-white font-semibold" id="rolesCount">
                    0 ролей
                </span>
            </div>
            
            <div id="rolesTableContainer" class="overflow-x-auto">
                <table class="w-full" id="rolesTable">
                    <thead>
                        <tr class="bg-gradient-to-r from-primary-600 to-purple-600 text-white">
                            <th class="px-4 py-3 text-left text-sm font-semibold uppercase tracking-wider rounded-tl-xl">
                                <i class="bi bi-hash me-1"></i>ID
                            </th>
                            <th class="px-4 py-3 text-left text-sm font-semibold uppercase tracking-wider">
                                <i class="bi bi-person-badge me-1"></i>Название роли
                            </th>
                            <th class="px-4 py-3 text-left text-sm font-semibold uppercase tracking-wider rounded-tr-xl">
                                <i class="bi bi-gear me-1"></i>Действия
                            </th>
                        </tr>
                    </thead>
                    <tbody id="rolesTbody" class="bg-white dark:bg-gray-800 divide-y divide-gray-100 dark:divide-gray-700">
                    </tbody>
                </table>
            </div>

            <!-- Empty state -->
            <div id="emptyState" class="hidden text-center py-12">
                <i class="bi bi-person-x text-5xl text-gray-300 dark:text-gray-600 mb-4"></i>
                <h4 class="text-lg font-semibold text-gray-600 dark:text-gray-400 mb-2">Роли не найдены</h4>
                <p class="text-gray-500 dark:text-gray-500">Создайте первую роль, нажав кнопку "Добавить новую роль" выше</p>
            </div>
        </div>
    </div>

    <script>
        const ROOT = '{{ root }}';
        let roles = [];

        // Theme Toggle
        const html = document.documentElement;
        const savedTheme = localStorage.getItem('theme');
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        
        if (savedTheme === 'dark' || (!savedTheme && systemPrefersDark)) {
            html.classList.add('dark');
        }

        // Load roles
        async function loadRoles() {
            try {
                const res = await fetch(ROOT + '/api/roles');
                roles = await res.json();
                
                renderRoles();
                updateStats();
            } catch (error) {
                console.error('Ошибка загрузки ролей:', error);
                alert('Ошибка загрузки ролей');
            }
        }

        // Render table
        function renderRoles() {
            const tbody = document.getElementById('rolesTbody');
            const emptyState = document.getElementById('emptyState');
            const tableContainer = document.getElementById('rolesTableContainer');
            
            if (roles.length === 0) {
                tbody.innerHTML = '';
                tableContainer.classList.add('hidden');
                emptyState.classList.remove('hidden');
                return;
            }

            tableContainer.classList.remove('hidden');
            emptyState.classList.add('hidden');
            
            tbody.innerHTML = roles.map(role => `
                <tr class="hover-effect transition-all">
                    <td class="px-4 py-4">
                        <span class="px-3 py-1 rounded-lg bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-400 text-sm font-semibold">
                            #${role.id}
                        </span>
                    </td>
                    <td class="px-4 py-4">
                        <div class="font-semibold text-gray-800 dark:text-white">${role.name}</div>
                        ${role.permissions ? 
                          `<small class="text-gray-500 dark:text-gray-400">
                            Права: ${Object.keys(role.permissions).filter(k => role.permissions[k]).join(', ') || 'Нет'}
                          </small>` : ''
                        }
                    </td>
                    <td class="px-4 py-4">
                        <button class="delete-btn btn-hover-lift px-4 py-2 bg-gradient-to-r from-red-500 to-red-600 hover:from-red-600 hover:to-red-700 text-white text-sm font-semibold rounded-lg transition-all" data-id="${role.id}">
                            <i class="bi bi-trash me-1"></i>Удалить
                        </button>
                    </td>
                </tr>
            `).join('');

            // Delete handlers
            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    const roleName = btn.closest('tr').querySelector('.font-semibold').textContent;
                    if (!confirm(`Вы уверены, что хотите удалить роль "${roleName}"?`)) {
                        return;
                    }

                    const id = btn.dataset.id;
                    try {
                        const res = await fetch(ROOT + `/api/roles/${id}`, { method: 'DELETE' });
                        if (res.ok) {
                            alert('✅ Роль успешно удалена!');
                            loadRoles();
                        } else {
                            const err = await res.json();
                            alert(`❌ ${err.error || 'Ошибка удаления роли'}`);
                        }
                    } catch (error) {
                        alert('❌ Ошибка сети');
                    }
                });
            });
        }

        // Update stats
        function updateStats() {
            document.getElementById('rolesCount').textContent = `${roles.length} ролей`;
        }

        // Add role
        document.getElementById('addRoleBtn').addEventListener('click', async () => {
            const name = document.getElementById('newRoleName').value.trim();
            if (!name) {
                alert('⚠️ Введите название роли');
                return;
            }

            try {
                const res = await fetch(ROOT + '/api/roles', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name })
                });

                if (res.ok) {
                    alert('✅ Роль успешно создана!');
                    document.getElementById('newRoleName').value = '';
                    loadRoles();
                } else {
                    const err = await res.json();
                    alert(`❌ ${err.error || 'Ошибка создания роли'}`);
                }
            } catch (error) {
                alert('❌ Ошибка сети');
            }
        });

        // Enter in input
        document.getElementById('newRoleName').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('addRoleBtn').click();
            }
        });

        // Initialize
        document.addEventListener('DOMContentLoaded', loadRoles);
    </script>
</body>
</html>
