<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{% block title %}Панель{% endblock %} — Астрахань. Живая История</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/astra.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/module3-pages.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script>
      (function () {
        var t = 'light';
        try { var s = localStorage.getItem('astra-theme'); if (s === 'dark' || s === 'light') t = s; } catch (e) {}
        var d = t === 'dark';
        document.documentElement.classList.toggle('app-dark', d);
        document.documentElement.classList.toggle('app-light', !d);
      })();
    </script>
    {% block head_extra %}{% endblock %}
</head>
<body class="astra-app">
    <script>
      (function () {
        var t = 'light';
        try { var s = localStorage.getItem('astra-theme'); if (s === 'dark' || s === 'light') t = s; } catch (e) {}
        var d = t === 'dark';
        document.body.classList.toggle('app-dark-theme', d);
        document.body.classList.toggle('app-light-theme', !d);
      })();
    </script>
    <a href="#main-content" class="m3-skip-link">К основному содержанию</a>
    <div class="m3-db-layout">
        <aside class="m3-sidebar" id="m3-sidebar" aria-label="Разделы панели">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:0.5rem;">
                <div class="m3-sidebar-brand">
                    <i class="bi bi-building" aria-hidden="true"></i>
                    <span>Живая История</span>
                </div>
                <button type="button" class="m3-menu-btn lg:hidden" id="m3SidebarClose" aria-label="Закрыть меню" style="display:none;">
                    <i class="bi bi-x-lg" aria-hidden="true"></i>
                </button>
            </div>
            <div id="roleBadge" class="m3-hidden tag" style="margin-bottom:1rem;"></div>
            <ul class="m3-sidebar-nav">
                <li><a href="{{ root }}/"><i class="bi bi-speedometer2" aria-hidden="true"></i> Главная</a></li>
                <li><a href="{{ root }}/users" class="nav-users"><i class="bi bi-people" aria-hidden="true"></i> Пользователи</a></li>
                <li><a href="{{ root }}/roles" class="nav-roles"><i class="bi bi-person-badge" aria-hidden="true"></i> Роли</a></li>
                <li><a href="{{ root }}/metrics"><i class="bi bi-graph-up" aria-hidden="true"></i> Метрики</a></li>
            </ul>
            <div class="m3-sidebar-footer">
                <button type="button" id="themeToggle" class="btn btn-ghost btn-sm theme-toggle-btn" style="width:100%;margin-bottom:0.75rem;">
                    <i class="bi bi-moon-stars" aria-hidden="true"></i>
                    <span id="themeToggleLabel">Тёмная тема</span>
                </button>
                <form method="post" action="{{ root }}/api/logout" class="sidebar-footer-form">
                    <button type="submit" class="btn btn-ghost btn-sm" style="width:100%;"><i class="bi bi-box-arrow-right" aria-hidden="true"></i> Выйти</button>
                </form>
            </div>
        </aside>
        <div id="m3SidebarOverlay" class="m3-sidebar-overlay" role="presentation" tabindex="-1" aria-hidden="true"></div>
        <main id="main-content" class="m3-main" tabindex="-1">
            <div class="m3-mobile-bar lg:hidden">
                <button type="button" class="m3-menu-btn" id="m3MenuBtn" aria-label="Открыть меню" aria-expanded="false" aria-controls="m3-sidebar">
                    <i class="bi bi-list" aria-hidden="true"></i>
                </button>
                <span class="text-mono" style="font-family:var(--font-mono);font-size:0.75rem;letter-spacing:0.06em;text-transform:uppercase;color:var(--gray-400);">Панель</span>
            </div>
            {% block content %}{% endblock %}
        </main>
    </div>
    <style>
      @media (min-width: 1025px) {
        .lg\:hidden { display: none !important; }
      }
      @media (max-width: 1024px) {
        #m3SidebarClose { display: inline-flex !important; }
      }
    </style>
    <script>
    (function () {
      var THEME_KEY = 'astra-theme';
      var root = document.documentElement;
      var body = document.body;
      var toggleBtn = document.getElementById('themeToggle');
      var toggleLabel = document.getElementById('themeToggleLabel');

      function applyTheme(theme) {
        var isDark = theme === 'dark';
        root.classList.toggle('app-dark', isDark);
        root.classList.toggle('app-light', !isDark);
        body.classList.toggle('app-dark-theme', isDark);
        body.classList.toggle('app-light-theme', !isDark);
        if (toggleLabel) {
          toggleLabel.textContent = isDark ? 'Светлая тема' : 'Тёмная тема';
        }
        if (toggleBtn) {
          var icon = toggleBtn.querySelector('i');
          if (icon) icon.className = 'bi ' + (isDark ? 'bi-sun' : 'bi-moon-stars');
          toggleBtn.setAttribute('aria-label', isDark ? 'Переключить на светлую тему' : 'Переключить на тёмную тему');
          toggleBtn.setAttribute('title', isDark ? 'Светлая тема' : 'Тёмная тема');
        }
      }

      function getTheme() {
        try {
          var stored = localStorage.getItem(THEME_KEY);
          if (stored === 'dark' || stored === 'light') return stored;
        } catch (_) {}
        return 'light';
      }

      function setTheme(theme) {
        applyTheme(theme);
        try { localStorage.setItem(THEME_KEY, theme); } catch (_) {}
        window.dispatchEvent(new CustomEvent('astra:theme-changed', { detail: { theme: theme } }));
      }

      setTheme(getTheme());

      if (toggleBtn) {
        toggleBtn.addEventListener('click', function () {
          var current = root.classList.contains('app-dark') ? 'dark' : 'light';
          setTheme(current === 'dark' ? 'light' : 'dark');
        });
      }

      var openBtn = document.getElementById('m3MenuBtn');
      var closeBtn = document.getElementById('m3SidebarClose');
      var overlay = document.getElementById('m3SidebarOverlay');
      function setOpen(open) {
        document.body.classList.toggle('m3-sidebar-open', open);
        if (openBtn) openBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
        if (overlay) overlay.setAttribute('aria-hidden', open ? 'false' : 'true');
      }
      if (openBtn) openBtn.addEventListener('click', function () { setOpen(true); });
      if (closeBtn) closeBtn.addEventListener('click', function () { setOpen(false); });
      if (overlay) overlay.addEventListener('click', function () { setOpen(false); });
      window.addEventListener('resize', function () {
        if (window.innerWidth > 1024) setOpen(false);
      });
    })();
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
