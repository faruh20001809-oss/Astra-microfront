<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Регистрация — Астрахань. Живая История</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/astra.css') }}">
</head>
<body class="astra-app">
<div class="login-page">
    <div class="login-box" style="max-width:440px;">
        <h1>Регистрация</h1>
        <p class="subtitle">Создание учётной записи</p>

        <div id="msg" class="login-error m3-hidden" role="alert" aria-live="polite"></div>

        <form id="regForm" novalidate>
            <div class="form-group">
                <label for="username">Имя пользователя</label>
                <input id="username" type="text" class="form-control" autocomplete="username" required minlength="3" />
            </div>
            <div class="form-group">
                <label for="name">Имя</label>
                <input id="name" type="text" class="form-control" autocomplete="name" />
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input id="email" type="email" class="form-control" autocomplete="email" />
            </div>
            <div class="form-group">
                <label for="password">Пароль</label>
                <input id="password" type="password" class="form-control" autocomplete="new-password" required minlength="6" />
            </div>
            <button type="submit" class="btn btn-primary">Создать аккаунт</button>
        </form>

        <p style="margin-top:1.25rem;text-align:center;font-size:0.85rem;color:var(--gray-400);">
            Уже есть аккаунт? <a href="{{ root }}/login" style="color:var(--accent);text-decoration:underline;">Войти</a>
        </p>
    </div>
</div>
<style>.m3-hidden{display:none!important}</style>
<script>
    const ROOT = '{{ root }}';
    document.getElementById('regForm').addEventListener('submit', async function (e) {
        e.preventDefault();
        const username = document.getElementById('username').value.trim();
        const name = document.getElementById('name').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();
        const msg = document.getElementById('msg');
        if (username.length < 3) {
            msg.textContent = 'Имя пользователя — не менее 3 символов.';
            msg.className = 'login-error';
            msg.classList.remove('m3-hidden');
            return;
        }
        if (password.length < 6) {
            msg.textContent = 'Пароль — не менее 6 символов.';
            msg.className = 'login-error';
            msg.classList.remove('m3-hidden');
            return;
        }
        msg.textContent = 'Создание аккаунта…';
        msg.className = 'login-logout';
        msg.classList.remove('m3-hidden');
        try {
            const res = await fetch(ROOT + '/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, name, email, password })
            });
            const data = await res.json().catch(function () { return {}; });
            if (!res.ok) {
                msg.textContent = (data.error || 'Ошибка регистрации') + (data.details ? ': ' + data.details : '') + ' Исправьте данные и повторите.';
                msg.className = 'login-error';
                return;
            }
            msg.textContent = 'Готово. Переход на страницу входа…';
            msg.className = 'login-logout';
            setTimeout(function () { window.location.href = ROOT + '/login'; }, 600);
        } catch (err) {
            msg.textContent = 'Нет соединения с сервером. Проверьте сеть.';
            msg.className = 'login-error';
        }
    });
</script>
</body>
</html>
