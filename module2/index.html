<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Историческая память Астрахани — виртуальная карта, маршруты, магазин" />
    <title>Астрахань. Живая История</title>

    <!-- ✅ Убраны пробелы в URL -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=IBM+Plex+Mono:wght@300;400;500&family=Source+Serif+4:opsz,wght@8..60,400;500;600&display=swap" rel="stylesheet" />

    <!-- ✅ 2GIS Maps API — БЕЗ пробелов -->
    <script src="https://mapgl.2gis.com/api/js/v1"></script>
    <!-- Светлая тема по умолчанию; до гидрации Vue читаем localStorage astra-theme -->
    <script>
      (function () {
        var t = 'light';
        try {
          var s = localStorage.getItem('astra-theme');
          if (s === 'dark' || s === 'light') t = s;
        } catch (e) {}
        var d = t === 'dark';
        var root = document.documentElement;
        root.classList.toggle('app-dark', d);
        root.classList.toggle('app-light', !d);
      })();
    </script>
</head>
<body>
    <script>
      (function () {
        var t = 'light';
        try {
          var s = localStorage.getItem('astra-theme');
          if (s === 'dark' || s === 'light') t = s;
        } catch (e) {}
        var d = t === 'dark';
        document.body.classList.toggle('app-dark-theme', d);
        document.body.classList.toggle('app-light-theme', !d);
      })();
    </script>
<div id="app"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
