# === Продакшен: контекст и настройки ===

# За Nginx: все пути бэкенда под /java-api
server.servlet.context-path=/java-api

# БД: та же PostgreSQL, что и у module3 (админка). Задайте SPRING_DATASOURCE_* или оставьте по умолчанию
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/museum_user}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Публичный URL основного фронта (для ссылок в письмах и платёжных возвратах). Пока по IP, потом заменить на домен
app.module2.url=${APP_MODULE2_URL:http://193.233.49.59}
# Публичный URL этого же Java API (для ссылок отписки в письмах), с context-path /java-api
app.api.public.base-url=${APP_API_PUBLIC_BASE_URL:http://193.233.49.59/java-api}
# URL админки (module3) — для редиректа «Управление пользователями»
app.admin.url=${APP_ADMIN_URL:http://193.233.49.59/admin}

# Почта: хост/логин/пароль — из переменных (см. application.properties и deploy/README-DEPLOY.md).
# В application.properties порт по умолчанию 587; для prod (Yandex/Mail.ru) — 465 + SSL.
spring.mail.port=${SPRING_MAIL_PORT:465}
# Для порта 587 (STARTTLS), например Gmail, задайте в окружении:
#   SPRING_MAIL_PORT=587
#   SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_ENABLE=false
#   SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE=true
spring.mail.properties.mail.smtp.ssl.enable=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:false}
# Не висеть на SMTP бесконечно (мс)
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true