# === Продакшен: контекст и настройки ===

# За Nginx: все пути бэкенда под /java-api
server.servlet.context-path=/java-api

# БД: та же PostgreSQL, что и у module3 (админка). Задайте SPRING_DATASOURCE_* или оставьте по умолчанию
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/museum_user}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Публичный URL основного фронта (для ссылок в письмах и платёжных возвратах). Пока по IP, потом заменить на домен
app.module2.url=${APP_MODULE2_URL:http://193.233.49.59}
# URL админки (module3) — для редиректа «Управление пользователями»
app.admin.url=${APP_ADMIN_URL:http://193.233.49.59/admin}

# Почта: для Yandex/Mail.ru на порту 465 нужен SSL (логин/пароль — из переменных окружения)
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true