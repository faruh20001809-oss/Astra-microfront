<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Вход — Астрахань. Живая История</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <style>
        .login-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg); padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom)); }
        .login-box { width: 100%; max-width: 380px; background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 32px; box-shadow: 0 4px 20px rgba(0,0,0,.08); }
        .login-box h1 { font-size: 20px; margin-bottom: 8px; }
        .login-box .subtitle { color: var(--text-light); font-size: 14px; margin-bottom: 24px; }
        .login-box .form-group { margin-bottom: 16px; }
        .login-box .form-control { width: 100%; min-height: 48px; font-size: 16px; }
        .login-box button[type="submit"] { width: 100%; padding: 12px; margin-top: 8px; min-height: 48px; }
        .login-error { background: #f8d7da; color: #721c24; padding: 12px; border-radius: var(--radius); margin-bottom: 16px; font-size: 14px; }
        .login-logout { background: #d4edda; color: #155724; padding: 12px; border-radius: var(--radius); margin-bottom: 16px; font-size: 14px; }
        @media (max-width: 480px) { .login-box { padding: 24px 20px; } }
    </style>
</head>
<body>
<div class="login-page">
    <div class="login-box">
        <h1>Панель администратора</h1>
        <p class="subtitle">Астрахань. Живая История</p>

        <div th:if="${param.error}" class="login-error">
            Неверный логин или пароль.
        </div>
        <div th:if="${param.logout}" class="login-logout">
            Вы вышли из системы.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="username">Логин</label>
                <input id="username" name="username" type="text" class="form-control" autocomplete="username" required autofocus />
            </div>
            <div class="form-group">
                <label for="password">Пароль</label>
                <input id="password" name="password" type="password" class="form-control" autocomplete="current-password" required />
            </div>
            <button type="submit" class="btn btn-primary">Войти</button>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        </form>
    </div>
</div>
</body>
</html>
