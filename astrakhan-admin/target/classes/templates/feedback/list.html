<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Обратная связь')}"></head><body class="astra-app"><div class="layout"><nav th:replace="~{fragments/layout :: sidebar}"></nav><main class="main-content">
<div class="page-header"><h1>💬 Обратная связь</h1><span th:if="${newCount > 0}" class="status-badge status-new" th:text="'Новых: '+${newCount}"></span></div>
<div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

<form th:action="@{/admin/feedback}" method="get" class="filter-bar" role="search" aria-label="Фильтры обращений">
  <div style="flex:1;min-width:220px;">
    <label for="q">Поиск</label>
    <input id="q" type="text" name="q" class="form-control" placeholder="Имя, email или тема" th:value="${q}">
  </div>
  <div>
    <label for="status">Статус</label>
    <select id="status" name="status" class="form-control">
      <option th:value="" th:selected="${currentStatus == null}">Все</option>
      <option th:value="NEW" th:selected="${currentStatus=='NEW'}">Новые</option>
      <option th:value="READ" th:selected="${currentStatus=='READ'}">Прочитанные</option>
      <option th:value="RESPONDED" th:selected="${currentStatus=='RESPONDED'}">С ответом</option>
      <option th:value="ARCHIVED" th:selected="${currentStatus=='ARCHIVED'}">Архив</option>
    </select>
  </div>
  <div>
    <label>&nbsp;</label>
    <button type="submit" class="btn">Показать</button>
  </div>
</form>

<div class="card"><div class="table-responsive"><table aria-label="Список обращений"><thead><tr><th>ID</th><th>Имя</th><th>Email</th><th>Тема</th><th>Сообщение</th><th>Статус</th><th>Дата</th><th>Действия</th></tr></thead><tbody>
<tr th:each="fb : ${feedbacks}"><td th:text="${fb.id}"></td><td th:text="${fb.name}"></td><td><small th:text="${fb.email}"></small></td><td th:text="${fb.subject}"></td><td th:text="${fb.message != null ? #strings.abbreviate(fb.message,60) : '—'}"></td><td><span class="status-badge" th:classappend="${fb.status != null ? 'status-'+fb.status.name().toLowerCase() : ''}" th:text="${fb.status != null ? fb.status.name() : '—'}"></span></td><td th:text="${fb.createdAt != null ? #temporals.format(fb.createdAt,'dd.MM.yyyy HH:mm') : '—'}"></td><td><div class="btn-group"><a th:href="@{'/admin/feedback/view/'+${fb.id}}" class="btn btn-sm">👁️</a><form th:action="@{'/admin/feedback/archive/'+${fb.id}}" method="post" style="display:inline"><button class="btn btn-sm btn-warning">📥</button></form></div></td></tr>
<tr th:if="${#lists.isEmpty(feedbacks)}"><td colspan="8" style="text-align:center;padding:40px;color:var(--gray-400)">Нет обращений</td></tr></tbody></table></div></div></main></div></body></html>
