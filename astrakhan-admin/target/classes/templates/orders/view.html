<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Заказ '+${order.orderId})}"></head>
<body>
<div class="layout">
    <nav th:replace="~{fragments/layout :: sidebar}"></nav>

    <main class="main-content">

        <!-- Header -->
        <div class="page-header">
            <h1 th:text="'📦 Заказ '+${order.orderId}"></h1>
            <a th:href="@{/admin/orders}" class="btn">← Назад</a>
        </div>

        <div class="grid-2">

            <!-- Левая колонка: Информация -->
            <div class="card">
                <div class="card-header"><h3>Информация</h3></div>

                <div class="detail-row">
                    <div class="detail-label">Номер</div>
                    <div class="detail-value" th:text="${order.orderId}"></div>
                </div>

                <div class="detail-row">
                    <div class="detail-label">Статус</div>
                    <div class="detail-value">
            <span class="status-badge"
                  th:classappend="'status-'+${order.status.name().toLowerCase()}"
                  th:text="${order.status.name()}">
            </span>
                    </div>
                </div>

                <div class="detail-row">
                    <div class="detail-label">Клиент</div>
                    <div class="detail-value" th:text="${order.customerName} ?: '—'"></div>
                </div>

                <div class="detail-row">
                    <div class="detail-label">Телефон</div>
                    <div class="detail-value">
                        <a th:if="${order.phone}" th:href="'tel:'+${order.phone}" th:text="${order.phone}"></a>
                        <span th:unless="${order.phone}">—</span>
                    </div>
                </div>

                <div class="detail-row">
                    <div class="detail-label">Email</div>
                    <div class="detail-value">
                        <a th:if="${order.email}" th:href="'mailto:'+${order.email}" th:text="${order.email}"></a>
                        <span th:unless="${order.email}">—</span>
                    </div>
                </div>

                <div class="detail-row">
                    <div class="detail-label">Сумма</div>
                    <div class="detail-value" th:text="${order.total} + ' ' + ${order.currency}"></div>
                </div>

                <div class="detail-row">
                    <div class="detail-label">Доставка</div>
                    <div class="detail-value" th:text="${order.shippingMethod}"></div>
                </div>

                <div class="detail-row">
                    <div class="detail-label">Адрес</div>
                    <div class="detail-value" th:text="${order.formattedAddress}"></div>
                </div>

                <div class="detail-row" th:if="${order.trackingNumber}">
                    <div class="detail-label">Трекинг</div>
                    <div class="detail-value" th:text="${order.trackingNumber}"></div>
                </div>

                <div class="detail-row">
                    <div class="detail-label">Дата</div>
                    <div class="detail-value" th:text="${#temporals.format(order.createdAt, 'dd.MM.yyyy HH:mm')}"></div>
                </div>

                <div class="detail-row" th:if="${order.adminNotes}">
                    <div class="detail-label">Заметки</div>
                    <div class="detail-value" th:text="${order.adminNotes}"></div>
                </div>
            </div>

            <!-- Правая колонка: Действия + Товары -->
            <div class="card">
                <div class="card-header"><h3>Обновить статус</h3></div>
                <form th:action="@{'/admin/orders/status/'+${order.id}}" method="post">
                    <div class="form-group">
                        <label>Статус</label>
                        <select name="status" class="form-control">
                            <option value="CONFIRMED" th:selected="${order.status.name() == 'CONFIRMED'}">Подтверждён</option>
                            <option value="PROCESSING" th:selected="${order.status.name() == 'PROCESSING'}">В обработке</option>
                            <option value="SHIPPED" th:selected="${order.status.name() == 'SHIPPED'}">Отправлен</option>
                            <option value="DELIVERED" th:selected="${order.status.name() == 'DELIVERED'}">Доставлен</option>
                            <option value="CANCELLED" th:selected="${order.status.name() == 'CANCELLED'}">Отменён</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Трекинг</label>
                        <input type="text" name="trackingNumber" class="form-control" th:value="${order.trackingNumber}"/>
                    </div>
                    <div class="form-group">
                        <label>Заметки</label>
                        <textarea name="adminNotes" class="form-control" rows="3" th:text="${order.adminNotes}"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">💾 Обновить</button>
                </form>
            </div>

            <!-- Содержимое заказа -->
            <div class="card full-width">
                <div class="card-header"><h3>Содержимое заказа</h3></div>

                <!-- Если itemsJson есть и не пустой -->
                <div th:if="${order.itemsList != null and !order.itemsList.empty}">
                    <table class="table">
                        <thead>
                        <tr>
                            <th>Товар</th>
                            <th>Цена</th>
                            <th>Кол-во</th>
                            <th>Сумма</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="item : ${order.itemsList}">
                            <td>
                                <strong th:text="${item.name}"></strong>
                                <span class="text-muted" th:if="${item.category}" th:text="' · '+${item.category}"></span>
                            </td>
                            <td th:text="${item.price} + ' ₽'"></td>
                            <td th:text="${item.qty}"></td>
                            <td th:text="${item.price * item.qty} + ' ₽'"></td>
                        </tr>
                        </tbody>
                        <tfoot>
                        <tr>
                            <td colspan="3" class="text-end"><strong>Итого:</strong></td>
                            <td><strong th:text="${order.total} + ' ' + ${order.currency}"></strong></td>
                        </tr>
                        </tfoot>
                    </table>
                </div>

                <!-- Fallback: если не удалось распарсить -->
                <div th:unless="${order.itemsList != null and !order.itemsList.empty}">
                    <p class="text-muted">Не удалось загрузить список товаров.</p>
                    <pre style="font-size:12px; background:var(--gray-900); padding:12px; border-radius:6px; overflow-x:auto;"
                         th:text="${order.itemsJson}"></pre>
                </div>
            </div>

        </div>
    </main>
</div>
</body>
</html>
