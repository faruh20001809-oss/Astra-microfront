<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${isEdit} ? 'Редактирование' : 'Новая точка')}"></head>
<body class="astra-app"><div class="layout"><nav th:replace="~{fragments/layout :: sidebar}"></nav>
<main class="main-content">
<div class="page-header"><h1 th:text="${isEdit} ? '✏️ Редактирование точки' : '📍 Новая точка'"></h1><a th:href="@{/admin/poi}" class="btn">← Назад</a></div>
<div class="card"><form th:action="@{/admin/poi/save}" method="post" enctype="multipart/form-data" th:object="${poi}">
<input type="hidden" th:field="*{id}"/>
<h3 style="margin-bottom:16px">Основная информация</h3>
<div class="form-group"><label>Название *</label><input type="text" class="form-control" th:field="*{name}" required/></div>
<div class="form-row">
    <div class="form-group"><label>Категория *</label><select class="form-control" th:field="*{category}" required><option value="">—</option><option value="История">История</option><option value="Архитектура">Архитектура</option><option value="Музеи">Музеи</option><option value="Парки">Парки</option><option value="Памятники">Памятники</option></select></div>
    <div class="form-group"><label>Статус</label><select class="form-control" th:field="*{status}"><option value="DRAFT">Черновик</option><option value="PENDING">На модерации</option><option value="PUBLISHED">Опубликовано</option><option value="ARCHIVED">В архиве</option></select></div>
</div>
<div class="form-group"><label>Описание</label><textarea class="form-control" th:field="*{description}" rows="4"></textarea></div>
<div class="form-group"><label>Адрес</label><input type="text" class="form-control" th:field="*{address}"/></div>
<h3 style="margin:24px 0 16px">Координаты для карты 2GIS</h3>
<div class="form-row">
    <div class="form-group"><label>Широта</label><input type="number" step="0.000001" class="form-control" th:field="*{latitude}" placeholder="46.3497"/></div>
    <div class="form-group"><label>Долгота</label><input type="number" step="0.000001" class="form-control" th:field="*{longitude}" placeholder="48.0332"/></div>
</div>
<h3 style="margin:24px 0 16px">Изображение</h3>
<div class="form-group"><label>Загрузить файл</label><input type="file" class="form-control" name="imageFile" accept="image/*"/><small style="color:#999">Передаётся в Модуль 2 вместе с JSON</small></div>
<div th:if="${isEdit and poi.imageData != null}" style="margin-top:8px"><img th:src="@{'/admin/poi/image/' + ${poi.id}}" style="max-width:200px;border-radius:8px"/></div>
<div class="form-group"><label>Или URL</label><input type="text" class="form-control" th:field="*{imageUrl}"/></div>
<h3 style="margin:24px 0 16px">Дополнительная информация</h3>
<div class="form-row"><div class="form-group"><label>Год основания</label><input type="number" class="form-control" th:field="*{foundedYear}"/></div><div class="form-group"><label>Архитектор</label><input type="text" class="form-control" th:field="*{architect}"/></div></div>
<div class="form-row"><div class="form-group"><label>Материал</label><input type="text" class="form-control" th:field="*{material}"/></div><div class="form-group"><label>Стиль</label><input type="text" class="form-control" th:field="*{style}"/></div></div>
<h3 style="margin:24px 0 16px">Контакты</h3>
<div class="form-row"><div class="form-group"><label>Телефон</label><input type="text" class="form-control" th:field="*{phone}"/></div><div class="form-group"><label>Email</label><input type="email" class="form-control" th:field="*{email}"/></div></div>
<div class="form-group"><label>Сайт</label><input type="text" class="form-control" th:field="*{website}"/></div>
<div class="form-group"><label>Теги (через запятую)</label><input type="text" class="form-control" th:field="*{tags}"/></div>
<h3 style="margin:24px 0 16px">Планирование</h3>
<div class="form-row"><div class="form-group"><label>Опубликовать в</label><input type="datetime-local" class="form-control" th:field="*{publishAt}"/></div><div class="form-group"><label>Снять с публикации</label><input type="datetime-local" class="form-control" th:field="*{unpublishAt}"/></div></div>
<div class="form-actions"><button type="submit" class="btn btn-primary">💾 Сохранить</button><a th:href="@{/admin/poi}" class="btn">Отмена</a></div>
</form></div></main></div></body></html>
