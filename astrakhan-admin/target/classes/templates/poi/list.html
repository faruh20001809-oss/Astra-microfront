<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Точки интереса')}"></head>
<body><div class="layout"><nav th:replace="~{fragments/layout :: sidebar}"></nav>
<main class="main-content">
<div class="page-header"><h1>📍 Точки интереса</h1><a th:href="@{/admin/poi/create}" class="btn btn-primary">+ Добавить</a></div>
<div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
<div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
<div class="filter-bar">
    <a th:href="@{/admin/poi}" class="btn" th:classappend="${currentStatus == null ? 'active' : ''}">Все</a>
    <a th:href="@{/admin/poi(status='DRAFT')}" class="btn" th:classappend="${currentStatus == 'DRAFT' ? 'active' : ''}">Черновики</a>
    <a th:href="@{/admin/poi(status='PUBLISHED')}" class="btn" th:classappend="${currentStatus == 'PUBLISHED' ? 'active' : ''}">Опубликованные</a>
    <a th:href="@{/admin/poi(status='ARCHIVED')}" class="btn" th:classappend="${currentStatus == 'ARCHIVED' ? 'active' : ''}">Архив</a>
</div>
<div class="card"><div class="table-responsive"><table>
<thead><tr><th>ID</th><th>Фото</th><th>Название</th><th>Категория</th><th>Координаты</th><th>Рейтинг</th><th>Просмотры</th><th>Статус</th><th>Действия</th></tr></thead>
<tbody>
<tr th:each="poi : ${pois}">
    <td th:text="${poi.id}"></td>
    <td><img th:if="${poi.imageData != null}" th:src="@{'/admin/poi/image/' + ${poi.id}}" class="thumbnail"/><div th:if="${poi.imageData == null}" class="thumbnail" style="display:flex;align-items:center;justify-content:center;font-size:20px">📍</div></td>
    <td><strong th:text="${poi.name}"></strong><br/><small th:text="${poi.address}" style="color:#999"></small></td>
    <td th:text="${poi.category}"></td>
    <td><small th:text="${poi.latitude != null ? poi.latitude + ', ' + poi.longitude : '—'}"></small></td>
    <td><span class="rating" th:text="${poi.rating != null ? '★ ' + poi.rating : '—'}"></span></td>
    <td th:text="${poi.viewsCount}"></td>
    <td><span class="status-badge" th:classappend="'status-' + ${poi.status.name().toLowerCase()}" th:text="${poi.status.name()}"></span></td>
    <td><div class="btn-group">
        <a th:href="@{'/admin/poi/edit/' + ${poi.id}}" class="btn btn-sm">✏️</a>
        <form th:if="${poi.status.name() != 'PUBLISHED'}" th:action="@{'/admin/poi/publish/' + ${poi.id}}" method="post" style="display:inline"><button class="btn btn-sm btn-success">📤</button></form>
        <form th:if="${poi.status.name() == 'PUBLISHED'}" th:action="@{'/admin/poi/archive/' + ${poi.id}}" method="post" style="display:inline"><button class="btn btn-sm btn-warning">📥</button></form>
        <form th:action="@{'/admin/poi/delete/' + ${poi.id}}" method="post" style="display:inline" onsubmit="return confirm('Удалить?')"><button class="btn btn-sm btn-danger">🗑️</button></form>
    </div></td>
</tr>
<tr th:if="${#lists.isEmpty(pois)}"><td colspan="9" style="text-align:center;padding:40px;color:#999">Нет точек интереса</td></tr>
</tbody></table></div></div>
</main></div></body></html>
