<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Товары')}"></head><body><div class="layout"><nav th:replace="~{fragments/layout :: sidebar}"></nav><main class="main-content">
<div class="page-header"><h1>🛒 Товары</h1><a th:href="@{/admin/products/create}" class="btn btn-primary">+ Добавить</a></div>
<div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
<div class="card"><table><thead><tr><th>ID</th><th>Название</th><th>Категория</th><th>Цена</th><th>На складе</th><th>Рейтинг</th><th>Статус</th><th>Действия</th></tr></thead><tbody>
<tr th:each="p : ${products}"><td th:text="${p.id}"></td><td><strong th:text="${p.name}"></strong><br/><small th:text="${#strings.abbreviate(p.description,50)}" style="color:#999"></small></td><td th:text="${p.category}"></td><td th:text="${p.price+' ₽'}"></td><td th:text="${p.quantity}"></td><td><span class="rating" th:text="${p.rating != null ? '★ '+p.rating : '—'}"></span></td><td><span class="status-badge" th:classappend="${p.inStock ? 'status-published' : 'status-cancelled'}" th:text="${p.inStock ? 'В наличии' : 'Нет'}"></span></td>
<td><div class="btn-group"><a th:href="@{'/admin/products/edit/'+${p.id}}" class="btn btn-sm">✏️</a><form th:action="@{'/admin/products/delete/'+${p.id}}" method="post" style="display:inline" onsubmit="return confirm('Удалить?')"><button class="btn btn-sm btn-danger">🗑️</button></form></div></td></tr>
<tr th:if="${#lists.isEmpty(products)}"><td colspan="8" style="text-align:center;padding:40px;color:#999">Нет товаров</td></tr></tbody></table></div></main></div></body></html>
