<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head(${isEdit}?'Редактирование':'Новый товар')}"></head><body class="astra-app"><div class="layout"><nav th:replace="~{fragments/layout :: sidebar}"></nav><main class="main-content">
<div class="page-header"><h1 th:text="${isEdit}?'✏️ Редактирование товара':'🛒 Новый товар'"></h1><a th:href="@{/admin/products}" class="btn">← Назад</a></div>
<div class="card">
  <form th:action="@{/admin/products/save}" method="post" enctype="multipart/form-data" th:object="${product}">
    <input type="hidden" th:field="*{id}"/>

    <h3>Основное</h3>
    <div class="form-group"><label>Название *</label><input type="text" class="form-control" th:field="*{name}" required/></div>
    <div class="form-group"><label>Описание</label><textarea class="form-control" th:field="*{description}" rows="3"></textarea></div>
    <div class="form-row">
      <div class="form-group"><label>Категория</label><select class="form-control" th:field="*{category}"><option value="">—</option><option value="Одежда">Одежда</option><option value="Сувениры">Сувениры</option><option value="Открытки">Открытки</option><option value="Кружки">Кружки</option></select></div>
      <div class="form-group"><label>Цена (₽) *</label><input type="number" step="0.01" class="form-control" th:field="*{price}" required/></div>
    </div>

    <h3 style="margin-top:24px">Медиа</h3>
    <div class="form-group"><label>Изображение</label><input type="file" class="form-control" name="imageFile" accept="image/*"/></div>

    <h3 style="margin-top:24px">Публикация и склад</h3>
    <div class="form-row">
      <div class="form-group"><label>Количество</label><input type="number" class="form-control" th:field="*{quantity}"/></div>
      <div class="form-group"><label>В наличии</label><select class="form-control" th:field="*{inStock}"><option value="true">Да</option><option value="false">Нет</option></select></div>
    </div>
    <div class="form-group"><label>Опубликован</label><select class="form-control" th:field="*{published}"><option value="true">Да</option><option value="false">Нет</option></select></div>

    <h3 style="margin-top:24px">Дополнительно</h3>
    <div class="form-group"><label>Размеры</label><input type="text" class="form-control" th:field="*{sizes}" placeholder="XS,S,M,L,XL"/></div>
    <div class="form-group"><label>Цвета</label><input type="text" class="form-control" th:field="*{colors}" placeholder="Черный,Белый"/></div>
    <div class="form-row">
      <div class="form-group"><label>Материал</label><input type="text" class="form-control" th:field="*{material}"/></div>
      <div class="form-group"><label>Вес</label><input type="text" class="form-control" th:field="*{weight}"/></div>
    </div>

    <div class="form-actions" style="position:sticky;bottom:0;background:var(--gray-800);z-index:2;">
      <button type="submit" class="btn btn-primary" style="margin-left:auto">💾 Сохранить</button>
      <a th:href="@{/admin/products}" class="btn btn-ghost">Отмена</a>
    </div>
  </form>
</div></main></div></body></html>
