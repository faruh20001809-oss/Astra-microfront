<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Аналитика')}"></head><body class="astra-app"><div class="layout"><nav th:replace="~{fragments/layout :: sidebar}"></nav><main class="main-content">
<div class="page-header"><h1>📈 Аналитика</h1></div>
<div class="stats-grid">
<div class="stat-card"><div class="stat-icon">👁️</div><div class="stat-value" th:text="${poiViews}">0</div><div class="stat-label">Просмотров точек</div></div>
<div class="stat-card"><div class="stat-icon">🚶</div><div class="stat-value" th:text="${routeViews}">0</div><div class="stat-label">Просмотров маршрутов</div></div>
<div class="stat-card"><div class="stat-icon">📦</div><div class="stat-value" th:text="${orderCount}">0</div><div class="stat-label">Заказов</div></div>
<div class="stat-card"><div class="stat-icon">💰</div><div class="stat-value" th:text="${#numbers.formatDecimal(revenue,0,0)}+' ₽'">0 ₽</div><div class="stat-label">Выручка</div></div></div>
<div class="grid-2">
<div class="card"><div class="card-header"><h3>🔥 Самые просматриваемые точки</h3></div>
<div th:if="${#lists.isEmpty(topPois)}" style="text-align:center;padding:20px;color:#999">Нет данных</div>
<div th:each="item,stat:${topPois}" th:if="${stat.index < 10}" class="chart-bar"><div class="chart-bar-label" th:text="${item[0]}"></div><div class="chart-bar-fill" th:style="'width:'+${item[1]}+'px;max-width:300px'"></div><div class="chart-bar-value" th:text="${item[1]}"></div></div></div>
<div class="card"><div class="card-header"><h3>⭐ Лучшие по рейтингу</h3></div>
<table><thead><tr><th>Название</th><th>Рейтинг</th><th>Просмотры</th></tr></thead><tbody>
<tr th:each="p,stat:${topRatedPois}" th:if="${stat.index < 10}"><td th:text="${p.name}"></td><td><span class="rating" th:text="'★ '+${p.rating}"></span></td><td th:text="${p.viewsCount}"></td></tr>
<tr th:if="${#lists.isEmpty(topRatedPois)}"><td colspan="3" style="text-align:center;color:#999">Нет данных</td></tr></tbody></table></div></div>
<div class="grid-2">
<div class="card"><div class="card-header"><h3>🚶 Популярные маршруты</h3></div>
<div th:if="${#lists.isEmpty(topRoutes)}" style="text-align:center;padding:20px;color:#999">Нет данных</div>
<div th:each="item,stat:${topRoutes}" th:if="${stat.index < 10}" class="chart-bar"><div class="chart-bar-label" th:text="${item[0]}"></div><div class="chart-bar-fill" th:style="'width:'+${item[1]}+'px;max-width:300px'"></div><div class="chart-bar-value" th:text="${item[1]}"></div></div></div>
<div class="card"><div class="card-header"><h3>📊 Точки по категориям</h3></div>
<table><thead><tr><th>Категория</th><th>Количество</th></tr></thead><tbody>
<tr th:each="item:${categoryStats}"><td th:text="${item[0]}"></td><td th:text="${item[1]}"></td></tr>
<tr th:if="${#lists.isEmpty(categoryStats)}"><td colspan="2" style="text-align:center;color:#999">Нет данных</td></tr></tbody></table></div></div>
</main></div></body></html>
