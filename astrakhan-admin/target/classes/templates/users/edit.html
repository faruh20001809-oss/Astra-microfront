<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Редактирование пользователя')}"></head>
<body>
<div class="layout">
<nav th:replace="~{fragments/layout :: sidebar}"></nav>
<main class="main-content">
<div class="page-header"><h1>✏️ Редактирование: <span th:text="${user.username}"></span></h1><a th:href="@{/admin/users}" class="btn">← Назад</a></div>
<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
<div class="card">
<form th:action="@{'/admin/users/edit/'+${user.id}}" method="post">
  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
  <div class="form-group"><label>Логин</label><input type="text" class="form-control" th:value="${user.username}" disabled/></div>
  <div class="form-group"><label>Новый пароль</label><input type="password" name="newPassword" class="form-control" placeholder="Оставьте пустым, чтобы не менять пароль"/></div>
  <div class="form-group"><label>Роль</label><select name="role" class="form-control"><option value="ADMIN" th:selected="${user.role == 'ADMIN'}">ADMIN</option><option value="MANAGER" th:selected="${user.role == 'MANAGER'}">MANAGER</option><option value="VIEWER" th:selected="${user.role == 'VIEWER'}">VIEWER</option></select></div>
  <div class="form-actions"><button type="submit" class="btn btn-primary">💾 Сохранить</button><a th:href="@{/admin/users}" class="btn">Отмена</a></div>
</form>
</div>
</main></div></body></html>
