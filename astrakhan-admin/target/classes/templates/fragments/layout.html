<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="">
<head th:fragment="head(title)">
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' — Астрахань. Живая История'">Admin</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<nav th:fragment="sidebar" class="sidebar">
    <div class="sidebar-header"><h2>Живая История</h2><small>Панель администратора</small></div>
    <ul class="sidebar-nav">
        <!-- 👇 Все #request и #httpServletRequest заменены на request -->
        <li><a th:href="@{/admin}" th:classappend="${request.requestURI == '/admin' ? 'active' : ''}"><span class="icon">📊</span><span>Дашборд</span></a></li>

        <li><a th:href="@{/admin/poi}" th:classappend="${#strings.startsWith(request.requestURI, '/admin/poi') and request.requestURI != '/admin/poi/reviews' ? 'active' : ''}"><span class="icon">📍</span><span>Точки интереса</span></a></li>

        <li><a th:href="@{/admin/routes}" th:classappend="${#strings.startsWith(request.requestURI, '/admin/routes') ? 'active' : ''}"><span class="icon">🚶</span><span>Маршруты</span></a></li>

        <li><a th:href="@{/admin/products}" th:classappend="${#strings.startsWith(request.requestURI, '/admin/products') ? 'active' : ''}"><span class="icon">🛒</span><span>Товары</span></a></li>

        <li><a th:href="@{/admin/orders}" th:classappend="${#strings.startsWith(request.requestURI, '/admin/orders') ? 'active' : ''}"><span class="icon">📦</span><span>Заказы</span></a></li>

        <li><a th:href="@{/admin/feedback}" th:classappend="${#strings.startsWith(request.requestURI, '/admin/feedback') ? 'active' : ''}"><span class="icon">💬</span><span>Обратная связь</span></a></li>

        <li><a th:href="@{/admin/poi/reviews}" th:classappend="${request.requestURI == '/admin/poi/reviews' ? 'active' : ''}"><span class="icon">⭐</span><span>Отзывы</span></a></li>

        <li><a th:href="@{/admin/analytics}" th:classappend="${#strings.startsWith(request.requestURI, '/admin/analytics') ? 'active' : ''}"><span class="icon">📈</span><span>Аналитика</span></a></li>
    </ul>
</nav>
</body>
</html>
