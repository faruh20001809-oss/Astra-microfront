server.port=8080
spring.datasource.url=jdbc:h2:file:./data/astrakhan_db;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.thymeleaf.cache=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.module2.url=http://localhost:3000
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.time-zone=Europe/Moscow
# ??????????? SQL (??? ???????)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Mail (SMTP). Set in production or use Mailtrap for dev.
spring.mail.host=smtp.example.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=noreply@astrakhan-history.local

# Online payment (stub). For production: set provider (yookassa, robokassa, etc.) and credentials.
app.payment.enabled=true
app.payment.provider=stub
