# === Продакшен: контекст и настройки ===

# За Nginx: все пути бэкенда под /java-api
server.servlet.context-path=/java-api

# БД и JPA
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Публичный URL фронта (для ссылок в письмах и платёжных возвратах). Задаётся через APP_MODULE2_URL на сервере.
app.module2.url=${APP_MODULE2_URL:http://193.233.49.59}

# Почта: для Yandex/Mail.ru на порту 465 нужен SSL (логин/пароль — из переменных окружения)
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=false
