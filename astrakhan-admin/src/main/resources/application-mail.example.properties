# Пример настройки почты для отправки писем о заказах.
# Скопируйте в application-local.properties или задайте переменные окружения на сервере.
#
# Переменные окружения (рекомендуется для продакшена):
#   SPRING_MAIL_HOST     — хост SMTP (например smtp.yandex.ru)
#   SPRING_MAIL_PORT     — порт (587 для STARTTLS, 465 для SSL)
#   SPRING_MAIL_USERNAME — логин (часто совпадает с email)
#   SPRING_MAIL_PASSWORD — пароль или пароль приложения
#   APP_MAIL_FROM        — адрес отправителя (должен быть разрешён у провайдера)
#
# --- Yandex ---
# spring.mail.host=smtp.yandex.ru
# spring.mail.port=465
# spring.mail.username=your-email@yandex.ru
# spring.mail.password=your-app-password
# spring.mail.properties.mail.smtp.ssl.enable=true
# app.mail.from=your-email@yandex.ru
#
# --- Mail.ru ---
# spring.mail.host=smtp.mail.ru
# spring.mail.port=465
# spring.mail.username=your-email@mail.ru
# spring.mail.password=your-password
# spring.mail.properties.mail.smtp.ssl.enable=true
# app.mail.from=your-email@mail.ru
#
# --- Mailtrap (тесты) ---
# spring.mail.host=sandbox.smtp.mailtrap.io
# spring.mail.port=2525
# spring.mail.username=your-mailtrap-user
# spring.mail.password=your-mailtrap-pass
# app.mail.from=noreply@astrakhan-history.local
