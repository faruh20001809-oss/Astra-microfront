<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title th:text="${title} + ' — Астрахань. Живая История'">Admin</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/astra.css(v=4)}">
    <link rel="stylesheet" th:href="@{/css/admin.css(v=6)}">
    <script>
      (function () {
        var t = 'light';
        try { var s = localStorage.getItem('astra-theme'); if (s === 'dark' || s === 'light') t = s; } catch (e) {}
        var d = t === 'dark';
        document.documentElement.classList.toggle('app-dark', d);
        document.documentElement.classList.toggle('app-light', !d);
      })();
    </script>
    <script defer th:src="@{/js/astra-theme.js(v=1)}"></script>
    <script th:inline="javascript">
      document.addEventListener('DOMContentLoaded', function() {
        var layout = document.querySelector('.layout');
        if (!layout) return;
        var sidebar = document.getElementById('admin-sidebar');
        var overlay = document.getElementById('sidebar-overlay');
        var closeBtn = document.getElementById('sidebar-close-btn');
        var scrollY = 0;
        var burgerSvg = '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" width="22" height="22" aria-hidden="true" focusable="false"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 4.5h16.5"/></svg>';
        function openMenu() {
          document.body.classList.add('sidebar-open');
          if (overlay) {
            overlay.setAttribute('aria-hidden', 'false');
          }
          var mb = document.getElementById('mobile-menu-btn');
          if (mb) mb.setAttribute('aria-expanded', 'true');
          if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            scrollY = window.scrollY;
            document.body.style.position = 'fixed';
            document.body.style.top = '-' + scrollY + 'px';
            document.body.style.left = '0';
            document.body.style.right = '0';
          }
        }
        function closeMenu() {
          document.body.classList.remove('sidebar-open');
          if (overlay) {
            overlay.setAttribute('aria-hidden', 'true');
          }
          var mb = document.getElementById('mobile-menu-btn');
          if (mb) mb.setAttribute('aria-expanded', 'false');
          if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            document.body.style.position = '';
            document.body.style.top = '';
            document.body.style.left = '';
            document.body.style.right = '';
            window.scrollTo(0, scrollY);
          }
        }
        if (overlay) overlay.addEventListener('click', closeMenu);
        if (closeBtn) closeBtn.addEventListener('click', closeMenu);
        var topbar = document.querySelector('.mobile-topbar');
        if (!topbar) {
          topbar = document.createElement('div');
          topbar.className = 'mobile-topbar';
          topbar.setAttribute('role', 'banner');
          topbar.innerHTML = '<button type="button" class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Открыть меню" aria-expanded="false" aria-controls="admin-sidebar">' + burgerSvg + '</button><span class="mobile-topbar-title">Админ</span>';
          var main = document.querySelector('.main-content');
          if (main) main.insertBefore(topbar, main.firstChild);
          var menuBtn = topbar.querySelector('#mobile-menu-btn');
          if (menuBtn) menuBtn.addEventListener('click', openMenu);
        }
      });
    </script>
</head>
<body>
<div th:fragment="sidebar" class="sidebar-wrapper">
    <div class="sidebar-overlay" id="sidebar-overlay" aria-hidden="true"></div>
    <nav class="sidebar" id="admin-sidebar" th:with="uri=${request != null and request.requestURI != null ? request.requestURI : ''}" aria-label="Разделы администратора">
        <button type="button" class="sidebar-close-btn" id="sidebar-close-btn" aria-label="Закрыть меню">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" width="22" height="22" aria-hidden="true" focusable="false"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/></svg>
        </button>
    <div class="sidebar-header"><h2>Живая История</h2><small>Панель администратора</small></div>
    <ul class="sidebar-nav">
        <li th:with="active=${#strings.contains(uri, '/admin') and !#strings.contains(uri, '/admin/')}">
            <a th:href="@{/admin}" th:classappend="${active ? 'active' : ''}" th:aria-current="${active ? 'page' : _}">
                <span class="icon" aria-hidden="true"><svg class="sidebar-nav-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" width="20" height="20" aria-hidden="true" focusable="false"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 0 1 6 3.75h2.25A2.25 2.25 0 0 1 10.5 6v2.25a2.25 2.25 0 0 1-2.25 2.25H6a2.25 2.25 0 0 1-2.25-2.25V6ZM3.75 15.75A2.25 2.25 0 0 1 6 13.5h2.25a2.25 2.25 0 0 1 2.25 2.25V18a2.25 2.25 0 0 1-2.25 2.25H6A2.25 2.25 0 0 1 3.75 18v-2.25ZM13.5 6a2.25 2.25 0 0 1 2.25-2.25H18A2.25 2.25 0 0 1 20.25 6v2.25A2.25 2.25 0 0 1 18 10.5h-2.25a2.25 2.25 0 0 1-2.25-2.25V6ZM13.5 15.75a2.25 2.25 0 0 1 2.25-2.25H18a2.25 2.25 0 0 1 2.25 2.25V18A2.25 2.25 0 0 1 18 20.25h-2.25A2.25 2.25 0 0 1 13.5 18v-2.25Z"/></svg></span><span>Дашборд</span>
            </a>
        </li>
        <li th:with="active=${#strings.contains(uri, '/admin/poi') and !#strings.contains(uri, '/admin/poi-suggestions') and !#strings.contains(uri, '/admin/poi/reviews')}">
            <a th:href="@{/admin/poi}" th:classappend="${active ? 'active' : ''}" th:aria-current="${active ? 'page' : _}">
                <span class="icon" aria-hidden="true"><svg class="sidebar-nav-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" width="20" height="20" aria-hidden="true" focusable="false"><path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z"/></svg></span><span>Точки интереса</span>
            </a>
        </li>
        <li th:with="active=${#strings.contains(uri, '/admin/poi-suggestions')}">
            <a th:href="@{/admin/poi-suggestions}" th:classappend="${active ? 'active' : ''}" th:aria-current="${active ? 'page' : _}">
                <span class="icon" aria-hidden="true"><svg class="sidebar-nav-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" width="20" height="20" aria-hidden="true" focusable="false"><path stroke-linecap="round" stroke-linejoin="round" d="M12 18v-5.25m0 0a6.01 6.01 0 0 0 1.5-.189m-1.5.189a6.01 6.01 0 0 1-1.5-.189m3.75 7.478a3 3 0 0 0-6-.373c0 1.183 1.046 2.126 2.25 2.126 1.207 0 2.25-.946 2.25-2.126 0-.873-.526-1.597-1.252-1.864M18.75 8.25a6.75 6.75 0 1 1-13.5 0 6.75 6.75 0 0 1 13.5 0Z"/></svg></span><span>Предложения точек</span>
            </a>
        </li>
        <li th:with="active=${#strings.contains(uri, '/admin/routes')}">
            <a th:href="@{/admin/routes}" th:classappend="${active ? 'active' : ''}" th:aria-current="${active ? 'page' : _}">
                <span class="icon" aria-hidden="true"><svg class="sidebar-nav-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" width="20" height="20" aria-hidden="true" focusable="false"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3"/></svg></span><span>Маршруты</span>
            </a>
        </li>
        <li th:with="active=${#strings.contains(uri, '/admin/products')}">
            <a th:href="@{/admin/products}" th:classappend="${active ? 'active' : ''}" th:aria-current="${active ? 'page' : _}">
                <span class="icon" aria-hidden="true"><svg class="sidebar-nav-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" width="20" height="20" aria-hidden="true" focusable="false"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 10.5V6a3.75 3.75 0 1 0-7.5 0v4.5m11.356-1.993 1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 0 1-1.12-1.243l1.264-12A1.125 1.125 0 0 1 5.513 7.5h12.974c.576 0 1.059.435 1.119 1.007ZM8.625 10.5a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm7.5 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z"/></svg></span><span>Товары</span>
            </a>
        </li>
        <li th:with="active=${#strings.contains(uri, '/admin/orders')}">
            <a th:href="@{/admin/orders}" th:classappend="${active ? 'active' : ''}" th:aria-current="${active ? 'page' : _}">
                <span class="icon" aria-hidden="true"><svg class="sidebar-nav-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" width="20" height="20" aria-hidden="true" focusable="false"><path stroke-linecap="round" stroke-linejoin="round" d="M20.25 7.5l-.625 10.632a2.25 2.25 0 0 1-2.247 2.118H6.622a2.25 2.25 0 0 1-2.247-2.118L3.75 7.5M10 11.25h4M3.375 7.5h17.25c.621 0 1.125-.504 1.125-1.125v-1.5c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125 1.125v1.5c0 .621.504 1.125 1.125 1.125Z"/></svg></span><span>Заказы</span>
            </a>
        </li>
        <li th:with="active=${#strings.contains(uri, '/admin/feedback')}">
            <a th:href="@{/admin/feedback}" th:classappend="${active ? 'active' : ''}" th:aria-current="${active ? 'page' : _}">
                <span class="icon" aria-hidden="true"><svg class="sidebar-nav-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" width="20" height="20" aria-hidden="true" focusable="false"><path stroke-linecap="round" stroke-linejoin="round" d="M7.5 8.25h9m-9 3H12m-9.75 1.51v0a9 9 0 0 1 9-9h.75a9 9 0 0 1 9 9v.75a9 9 0 0 1-9 9h-3.75a3 3 0 0 1-3-3v-.75A9 9 0 0 1 7.5 13.26Z"/></svg></span><span>Обратная связь</span>
            </a>
        </li>
        <li th:with="active=${#strings.contains(uri, '/admin/poi/reviews')}">
            <a th:href="@{/admin/poi/reviews}" th:classappend="${active ? 'active' : ''}" th:aria-current="${active ? 'page' : _}">
                <span class="icon" aria-hidden="true"><svg class="sidebar-nav-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" width="20" height="20" aria-hidden="true" focusable="false"><path stroke-linecap="round" stroke-linejoin="round" d="M11.48 3.499a.562.562 0 0 1 1.04 0l2.125 5.111a.563.563 0 0 0 .475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 0 0-.182.557l1.285 5.385a.562.562 0 0 1-.84.61l-4.725-2.885a.562.562 0 0 0-.586 0L6.982 20.54a.562.562 0 0 1-.84-.61l1.285-5.386a.562.562 0 0 0-.182-.557l-4.204-3.602a.562.562 0 0 1 .321-.988l5.518-.442a.563.563 0 0 0 .475-.345L11.48 3.5Z"/></svg></span><span>Отзывы</span>
            </a>
        </li>
        <li th:with="active=${#strings.contains(uri, '/admin/analytics')}">
            <a th:href="@{/admin/analytics}" th:classappend="${active ? 'active' : ''}" th:aria-current="${active ? 'page' : _}">
                <span class="icon" aria-hidden="true"><svg class="sidebar-nav-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" width="20" height="20" aria-hidden="true" focusable="false"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 3v11.25c0 .621.504 1.125 1.125 1.125h5.055M18 18.75V13.5M21 18.75V9M15 18.75v-8.25M9 18.75v-4.5M3.75 18.75v-4.5"/></svg></span><span>Аналитика</span>
            </a>
        </li>
        <li th:with="active=${#strings.contains(uri, '/admin/users')}">
            <a th:href="@{/admin/users}" th:classappend="${active ? 'active' : ''}" th:aria-current="${active ? 'page' : _}">
                <span class="icon" aria-hidden="true"><svg class="sidebar-nav-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" width="20" height="20" aria-hidden="true" focusable="false"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 0 0 2.625-.372 9.337 9.337 0 0 0 4.121-2.43 4.5 4.5 0 0 0-8.126-3.847 4.5 4.5 0 0 0-4.631 6.138 9.37 9.37 0 0 0 3.81 1.511M4.998 8.25a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm7.5 0a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/></svg></span><span>Пользователи</span>
            </a>
        </li>
    </ul>
    <div class="sidebar-theme-row" style="padding:0 12px 12px;">
        <button type="button" id="adminThemeToggle" class="btn btn-ghost btn-sm" style="width:100%">Тёмная тема</button>
    </div>
    <div class="sidebar-footer">
        <a th:href="@{/admin/profile}" class="btn btn-sm btn-ghost sidebar-footer-btn">Профиль</a>
        <form th:action="@{/logout}" method="post" class="sidebar-footer-form">
            <button type="submit" class="btn btn-sm sidebar-footer-logout">Выйти</button>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        </form>
    </div>
</nav>
</div>
</body>
</html>
