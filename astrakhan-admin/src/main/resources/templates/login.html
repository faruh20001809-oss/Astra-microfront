<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Вход — Астрахань. Живая История</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/astra.css}">
    <style>
        .astra-app .login-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--ink); padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom)); }
        .astra-app .login-box { width: 100%; max-width: 380px; background: var(--gray-800); border: 1px solid var(--gray-600); border-radius: var(--radius-md); padding: 32px; box-shadow: var(--shadow-card); }
        .astra-app .login-box h1 { font-family: var(--font-display); font-size: 20px; margin-bottom: 8px; color: var(--paper); }
        .astra-app .login-box .subtitle { color: var(--gray-400); font-size: 14px; margin-bottom: 24px; }
        .astra-app .login-box .form-group { margin-bottom: 16px; }
        .astra-app .login-box .form-control { width: 100%; min-height: 48px; font-size: 16px; background: var(--gray-900); border-color: var(--gray-600); color: var(--paper); }
        .astra-app .login-box button[type="submit"] { width: 100%; padding: 12px; margin-top: 8px; min-height: 48px; }
        .astra-app .login-error { background: rgba(192, 57, 43, 0.2); color: var(--danger); border: 1px solid var(--danger); padding: 12px; border-radius: var(--radius-sm); margin-bottom: 16px; font-size: 14px; }
        .astra-app .login-logout { background: rgba(26, 107, 58, 0.2); color: var(--success); border: 1px solid var(--success); padding: 12px; border-radius: var(--radius-sm); margin-bottom: 16px; font-size: 14px; }
        @media (max-width: 480px) { .astra-app .login-box { padding: 24px 20px; } }
    </style>
</head>
<body class="astra-app">
<div class="login-page">
    <div class="login-box">
        <h1>Панель администратора</h1>
        <p class="subtitle">Астрахань. Живая История</p>

        <div th:if="${param.error}" class="login-error">
            Неверный логин или пароль.
        </div>
        <div th:if="${param.logout}" class="login-logout">
            Вы вышли из системы.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="username">Логин</label>
                <input id="username" name="username" type="text" class="form-control" autocomplete="username" required autofocus />
            </div>
            <div class="form-group">
                <label for="password">Пароль</label>
                <input id="password" name="password" type="password" class="form-control" autocomplete="current-password" required />
            </div>
            <button type="submit" class="btn btn-primary">Войти</button>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        </form>
    </div>
</div>
</body>
</html>
