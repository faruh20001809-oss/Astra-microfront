<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Вход — Астрахань. Живая История</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/astra.css(v=4)}">
    <script>
      (function () {
        var t = 'light';
        try { var s = localStorage.getItem('astra-theme'); if (s === 'dark' || s === 'light') t = s; } catch (e) {}
        var d = t === 'dark';
        document.documentElement.classList.toggle('app-dark', d);
        document.documentElement.classList.toggle('app-light', !d);
      })();
    </script>
    <script defer th:src="@{/js/astra-theme.js(v=1)}"></script>
</head>
<body class="astra-app">
<script>
  (function () {
    var t = 'light';
    try { var s = localStorage.getItem('astra-theme'); if (s === 'dark' || s === 'light') t = s; } catch (e) {}
    var d = t === 'dark';
    document.body.classList.toggle('app-dark-theme', d);
    document.body.classList.toggle('app-light-theme', !d);
  })();
</script>
<div class="login-page">
    <div class="login-box">
        <h1>Панель администратора</h1>
        <p class="subtitle">Астрахань. Живая История</p>

        <div th:if="${param.error}" class="login-error">
            Неверный логин или пароль. Проверьте раскладку и Caps Lock, затем попробуйте снова.
        </div>
        <div th:if="${param.logout}" class="login-logout">
            Вы вышли из системы.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="username">Логин</label>
                <input id="username" name="username" type="text" class="form-control" autocomplete="username" required autofocus />
            </div>
            <div class="form-group">
                <label for="password">Пароль</label>
                <input id="password" name="password" type="password" class="form-control" autocomplete="current-password" required />
            </div>
            <button type="submit" class="btn btn-primary">Войти</button>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        </form>
    </div>
</div>
<button type="button" id="adminThemeToggle" class="btn btn-ghost btn-sm" style="position:fixed;bottom:1rem;right:1rem;z-index:50;min-height:44px" title="Тема оформления">Тёмная тема</button>
</body>
</html>
