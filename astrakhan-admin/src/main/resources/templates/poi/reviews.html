<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Модерация отзывов')}"></head>
<body class="astra-app"><div class="layout"><nav th:replace="~{fragments/layout :: sidebar}"></nav>
<main class="main-content">
<div class="page-header"><h1>⭐ Модерация отзывов</h1><span class="status-badge status-pending" th:text="'Ожидают: ' + ${pendingCount}"></span></div>
<div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
<div class="card"><table>
<thead><tr><th>ID</th><th>POI ID</th><th>Автор</th><th>Рейтинг</th><th>Текст</th><th>Дата</th><th>Действия</th></tr></thead>
<tbody>
<tr th:each="r : ${pendingReviews}"><td th:text="${r.id}"></td><td th:text="${r.poiId}"></td><td th:text="${r.userName}"></td><td><span class="rating" th:text="'★ '+${r.rating}"></span></td><td th:text="${r.text}"></td><td th:text="${#temporals.format(r.createdAt,'dd.MM.yyyy HH:mm')}"></td>
<td><div class="btn-group"><form th:action="@{'/admin/poi/reviews/approve/'+${r.id}}" method="post" style="display:inline"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/><button class="btn btn-sm btn-success">✅</button></form><form th:action="@{'/admin/poi/reviews/reject/'+${r.id}}" method="post" style="display:inline" onsubmit="return confirm('Отклонить?')"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/><button class="btn btn-sm btn-danger">❌</button></form></div></td></tr>
<tr th:if="${#lists.isEmpty(pendingReviews)}"><td colspan="7" style="text-align:center;padding:40px;color:#999">Нет отзывов на модерации</td></tr>
</tbody></table></div></main></div></body></html>
