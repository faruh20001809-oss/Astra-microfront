<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head(${isEdit}?'Редактирование':'Новый товар')}"></head><body class="astra-app"><div class="layout"><nav th:replace="~{fragments/layout :: sidebar}"></nav><main class="main-content">
<div class="page-header"><h1 th:text="${isEdit}?'✏️ Редактирование товара':'🛒 Новый товар'"></h1><a th:href="@{/admin/products}" class="btn">← Назад</a></div>
<div style="display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px;align-items:start">
<div class="card">
  <form id="productForm" th:action="@{/admin/products/save}" method="post" enctype="multipart/form-data" th:object="${product}">
    <input type="hidden" th:field="*{id}"/>
    <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

    <h3>Основное</h3>
    <div class="form-group"><label>Название *</label><input type="text" class="form-control" th:field="*{name}" required/></div>
    <div class="form-group"><label>Описание</label><textarea class="form-control" th:field="*{description}" rows="3"></textarea></div>
    <div class="form-row">
      <div class="form-group"><label>Категория</label><select class="form-control" th:field="*{category}"><option value="">—</option><option value="Одежда">Одежда</option><option value="Сувениры">Сувениры</option><option value="Открытки">Открытки</option><option value="Кружки">Кружки</option></select></div>
      <div class="form-group"><label>Цена (₽) *</label><input type="number" step="0.01" class="form-control" th:field="*{price}" required/></div>
    </div>

    <h3 style="margin-top:24px">Медиа</h3>
    <div class="form-group"><label>Изображение</label><input id="imageFileInput" type="file" class="form-control" name="imageFile" accept="image/*"/></div>

    <h3 style="margin-top:24px">Публикация и склад</h3>
    <div class="form-row">
      <div class="form-group"><label>Количество</label><input type="number" class="form-control" th:field="*{quantity}"/></div>
      <div class="form-group"><label>В наличии</label><select class="form-control" th:field="*{inStock}"><option value="true">Да</option><option value="false">Нет</option></select></div>
    </div>
    <div class="form-group"><label>Опубликован</label><select id="publishedSelect" class="form-control" th:field="*{published}"><option value="true">Да</option><option value="false">Нет</option></select></div>

    <h3 style="margin-top:24px">Дополнительно</h3>
    <div class="form-group"><label>Размеры</label><input id="sizesInput" type="text" class="form-control" th:field="*{sizes}" placeholder="XS,S,M,L,XL"/></div>
    <div class="form-group"><label>Цвета</label><input id="colorsInput" type="text" class="form-control" th:field="*{colors}" placeholder="Черный,Белый"/></div>
    <div class="form-group"><button type="button" class="btn btn-ghost btn-sm" onclick="applyTemplate('basic')">Шаблон атрибутов: базовый</button><button type="button" class="btn btn-ghost btn-sm" onclick="applyTemplate('clothes')">Шаблон: одежда</button></div>
    <p id="productFormError" style="display:none;color:#d66;font-size:12px"></p>
    <div class="form-row">
      <div class="form-group"><label>Материал</label><input type="text" class="form-control" th:field="*{material}"/></div>
      <div class="form-group"><label>Вес</label><input type="text" class="form-control" th:field="*{weight}"/></div>
    </div>

    <div class="form-actions" style="position:sticky;bottom:0;background:var(--gray-800);z-index:2;">
      <button type="button" class="btn btn-ghost" id="product-save-draft-btn">Сохранить как черновик</button>
      <button type="button" class="btn btn-primary" id="product-save-publish-btn">Сохранить и опубликовать</button>
      <a th:href="@{/admin/products}" class="btn btn-ghost">Отмена</a>
    </div>
  </form>
</div>
<aside class="card" style="position:sticky;top:16px;padding:12px">
  <h3 style="margin-top:0">Сводка заполнения</h3>
  <div id="productSummary" style="font-size:12px;color:#bbb;line-height:1.6"></div>
  <div style="margin-top:10px;padding-top:10px;border-top:1px solid #333">
    <h4 style="margin:0 0 6px 0;font-size:13px">Preview карточки</h4>
    <div style="border:1px solid #333;border-radius:8px;padding:10px;font-size:12px">
      <p id="pvProductName" style="margin:0 0 4px 0;font-weight:600">Товар</p>
      <p id="pvProductMeta" style="margin:0;color:#999">Категория</p>
      <p id="pvProductPrice" style="margin:6px 0 0 0;color:#c8a96e">0 ₽</p>
    </div>
  </div>
</aside>
</div></main></div>
<script>
function applyTemplate(kind){const sizes=document.getElementById('sizesInput');const colors=document.getElementById('colorsInput');if(kind==='basic'){if(!sizes.value)sizes.value='one-size';if(!colors.value)colors.value='Черный,Белый'}if(kind==='clothes'){sizes.value='XS,S,M,L,XL';if(!colors.value)colors.value='Черный,Белый,Синий'}}
document.getElementById('productForm').addEventListener('submit',(e)=>{const published=document.getElementById('publishedSelect').value==='true';if(!published)return;const price=Number(document.querySelector('[name="price"]').value||0);const qty=Number(document.querySelector('[name="quantity"]').value||0);const file=document.getElementById('imageFileInput').files?.length||0;const err=document.getElementById('productFormError');if(!Number.isFinite(price)||price<=0||qty<1||file<1){e.preventDefault();err.style.display='block';err.textContent='Для опубликованного товара обязательны: цена > 0, остаток > 0 и изображение.';return}err.style.display='none'})
function saveDraft(){document.getElementById('publishedSelect').value='false';document.getElementById('productForm').requestSubmit()}
function saveAndPublish(){document.getElementById('publishedSelect').value='true';document.getElementById('productForm').requestSubmit()}
document.getElementById('product-save-draft-btn')?.addEventListener('click', saveDraft)
document.getElementById('product-save-publish-btn')?.addEventListener('click', saveAndPublish)
function updateProductSummary(){const name=document.querySelector('[name="name"]')?.value?.trim();const category=document.querySelector('[name="category"]')?.value?.trim();const price=Number(document.querySelector('[name="price"]')?.value||0);const qty=Number(document.querySelector('[name="quantity"]')?.value||0);const req=[['Название','[name="name"]',!!name],['Цена','[name="price"]',price>0],['Количество','[name="quantity"]',qty>=0],['Категория','[name="category"]',!!category]];document.getElementById('productSummary').innerHTML=req.map(r=>`${r[2]?'✅':'❌'} <a href="javascript:void(0)" onclick="document.querySelector('${r[1]}')?.scrollIntoView({behavior:'smooth',block:'center'})" style="color:${r[2]?'#8a8':'#d88'}">${r[0]}</a>`).join('<br>');document.getElementById('pvProductName').textContent=name||'Товар';document.getElementById('pvProductMeta').textContent=category||'Без категории';document.getElementById('pvProductPrice').textContent=`${price||0} ₽`}
document.querySelectorAll('#productForm input,#productForm select,#productForm textarea').forEach(el=>el.addEventListener('input',updateProductSummary))
document.querySelectorAll('#productForm input,#productForm select,#productForm textarea').forEach(el=>el.addEventListener('change',updateProductSummary))
updateProductSummary()
</script></body></html>
