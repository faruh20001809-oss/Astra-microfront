<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Заказы')}"></head><body><div class="layout"><nav th:replace="~{fragments/layout :: sidebar}"></nav><main class="main-content">
<div class="page-header"><h1>📦 Панель заказов</h1></div>
<div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

<form th:action="@{/admin/orders}" method="get" class="filter-bar" style="align-items:flex-end;">
  <input type="hidden" name="status" th:value="${currentStatus}"/>
  <input type="hidden" name="showArchived" th:if="${showArchived}" value="true"/>
  <label>Период:</label>
  <input type="date" name="dateFrom" th:value="${dateFrom != null ? #temporals.format(dateFrom, 'yyyy-MM-dd') : ''}" class="form-control" style="width:auto;display:inline-block;"/>
  <span>—</span>
  <input type="date" name="dateTo" th:value="${dateTo != null ? #temporals.format(dateTo, 'yyyy-MM-dd') : ''}" class="form-control" style="width:auto;display:inline-block;"/>
  <button type="submit" class="btn">Применить</button>
</form>

<div class="filter-bar">
  <a th:href="@{/admin/orders(dateFrom=${dateFrom}, dateTo=${dateTo}, showArchived=${showArchived})}" class="btn" th:classappend="${currentStatus==null?'active':''}">Все</a>
  <a th:href="@{/admin/orders(status='CONFIRMED', dateFrom=${dateFrom}, dateTo=${dateTo}, showArchived=${showArchived})}" class="btn" th:classappend="${currentStatus=='CONFIRMED'?'active':''}">Подтверждённые</a>
  <a th:href="@{/admin/orders(status='PROCESSING', dateFrom=${dateFrom}, dateTo=${dateTo}, showArchived=${showArchived})}" class="btn" th:classappend="${currentStatus=='PROCESSING'?'active':''}">В обработке</a>
  <a th:href="@{/admin/orders(status='SHIPPED', dateFrom=${dateFrom}, dateTo=${dateTo}, showArchived=${showArchived})}" class="btn" th:classappend="${currentStatus=='SHIPPED'?'active':''}">Отправленные</a>
  <a th:href="@{/admin/orders(status='DELIVERED', dateFrom=${dateFrom}, dateTo=${dateTo}, showArchived=${showArchived})}" class="btn" th:classappend="${currentStatus=='DELIVERED'?'active':''}">Доставленные</a>
  <a th:href="@{/admin/orders(status='CANCELLED', dateFrom=${dateFrom}, dateTo=${dateTo}, showArchived=${showArchived})}" class="btn" th:classappend="${currentStatus=='CANCELLED'?'active':''}">Отменённые</a>
  <a th:href="@{/admin/orders(status=${currentStatus}, dateFrom=${dateFrom}, dateTo=${dateTo}, showArchived=true)}" class="btn" th:classappend="${showArchived?'active':''}">Показать архив</a>
</div>

<div class="card"><table><thead><tr><th>№</th><th>Клиент</th><th>Контакт</th><th>Сумма</th><th>Доставка</th><th>Статус</th><th>Дата</th><th>Действия</th></tr></thead><tbody>
<tr th:each="o : ${orders}">
  <td><strong th:text="${o.orderId}"></strong><span th:if="${o.deleted}" class="text-muted" style="font-size:11px;"> (архив)</span></td>
  <td th:text="${o.customerName}"></td>
  <td><small th:text="${o.phone}"></small><br/><small th:text="${o.email}" style="color:#999"></small></td>
  <td th:text="${o.total+' ₽'}"></td>
  <td th:text="${o.shippingMethod}"></td>
  <td><span class="status-badge" th:classappend="'status-'+${o.status.name().toLowerCase()}" th:text="${o.status.name()}"></span></td>
  <td th:text="${#temporals.format(o.createdAt,'dd.MM.yyyy HH:mm')}"></td>
  <td>
    <a th:href="@{'/admin/orders/view/'+${o.id}}" class="btn btn-sm">👁️</a>
    <form th:if="${!o.deleted}" th:action="@{'/admin/orders/archive/'+${o.id}}" method="post" style="display:inline-block;margin-left:4px;">
      <button type="submit" class="btn btn-sm btn-ghost" onclick="return confirm('Переместить заказ в архив?');">В архив</button>
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    </form>
  </td>
</tr>
<tr th:if="${#lists.isEmpty(orders)}"><td colspan="8" style="text-align:center;padding:40px;color:#999">Нет заказов</td></tr></tbody></table></div></main></div></body></html>
