<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Заказы')}"></head><body><div class="layout"><nav th:replace="~{fragments/layout :: sidebar}"></nav><main class="main-content">
<div class="page-header"><h1>📦 Панель заказов</h1></div>
<div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
<div class="filter-bar"><a th:href="@{/admin/orders}" class="btn" th:classappend="${currentStatus==null?'active':''}">Все</a><a th:href="@{/admin/orders(status='CONFIRMED')}" class="btn" th:classappend="${currentStatus=='CONFIRMED'?'active':''}">Подтверждённые</a><a th:href="@{/admin/orders(status='PROCESSING')}" class="btn" th:classappend="${currentStatus=='PROCESSING'?'active':''}">В обработке</a><a th:href="@{/admin/orders(status='SHIPPED')}" class="btn" th:classappend="${currentStatus=='SHIPPED'?'active':''}">Отправленные</a><a th:href="@{/admin/orders(status='DELIVERED')}" class="btn" th:classappend="${currentStatus=='DELIVERED'?'active':''}">Доставленные</a><a th:href="@{/admin/orders(status='CANCELLED')}" class="btn" th:classappend="${currentStatus=='CANCELLED'?'active':''}">Отменённые</a></div>
<div class="card"><table><thead><tr><th>№</th><th>Клиент</th><th>Контакт</th><th>Сумма</th><th>Доставка</th><th>Статус</th><th>Дата</th><th>Действия</th></tr></thead><tbody>
<tr th:each="o : ${orders}"><td><strong th:text="${o.orderId}"></strong></td><td th:text="${o.customerName}"></td><td><small th:text="${o.phone}"></small><br/><small th:text="${o.email}" style="color:#999"></small></td><td th:text="${o.total+' ₽'}"></td><td th:text="${o.shippingMethod}"></td><td><span class="status-badge" th:classappend="'status-'+${o.status.name().toLowerCase()}" th:text="${o.status.name()}"></span></td><td th:text="${#temporals.format(o.createdAt,'dd.MM.yyyy HH:mm')}"></td><td><a th:href="@{'/admin/orders/view/'+${o.id}}" class="btn btn-sm">👁️</a></td></tr>
<tr th:if="${#lists.isEmpty(orders)}"><td colspan="8" style="text-align:center;padding:40px;color:#999">Нет заказов</td></tr></tbody></table></div></main></div></body></html>
