<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head(${isEdit}?'Редактирование':'Новый маршрут')}"></head><body class="astra-app"><div class="layout"><nav th:replace="~{fragments/layout :: sidebar}"></nav><main class="main-content">
<div class="page-header"><h1 th:text="${isEdit}?'✏️ Редактирование маршрута':'🚶 Новый маршрут'"></h1><a th:href="@{/admin/routes}" class="btn">← Назад</a></div>
<div class="card"><form th:action="@{/admin/routes/save}" method="post" enctype="multipart/form-data" th:object="${route}"><input type="hidden" th:field="*{id}"/>
<h3>Основное</h3>
<div class="form-group"><label>Название *</label><input type="text" class="form-control" th:field="*{name}" required/></div>
<div class="form-group"><label>Описание</label><textarea class="form-control" th:field="*{description}" rows="3"></textarea></div>
<div class="form-row"><div class="form-group"><label>Категория</label><select class="form-control" th:field="*{category}"><option value="">—</option><option value="История">История</option><option value="Архитектура">Архитектура</option><option value="Культура">Культура</option><option value="Природа">Природа</option></select></div><div class="form-group"><label>Сложность</label><select class="form-control" th:field="*{difficulty}"><option value="easy">Лёгкий</option><option value="medium">Средний</option><option value="hard">Сложный</option></select></div></div>

<h3 style="margin:24px 0 16px">Параметры маршрута</h3>
<div class="form-row"><div class="form-group"><label>Дистанция (км)</label><input type="number" step="0.1" class="form-control" th:field="*{distance}"/></div><div class="form-group"><label>Длительность (мин)</label><input type="number" class="form-control" th:field="*{duration}"/></div></div>

<h3 style="margin:24px 0 16px">Монетизация</h3>
<div class="form-row"><div class="form-group"><label>Платный</label><select class="form-control" th:field="*{paid}"><option value="false">Нет</option><option value="true">Да</option></select></div><div class="form-group"><label>Цена (₽)</label><input type="number" step="0.01" class="form-control" th:field="*{price}"/></div></div>

<h3 style="margin:24px 0 16px">Медиа</h3>
<div class="form-group"><label>Изображение</label><input type="file" class="form-control" name="imageFile" accept="image/*"/></div>

<h3 style="margin:24px 0 16px">Точки маршрута</h3>
<div class="form-group"><label>Выберите точки:</label><div style="max-height:200px;overflow-y:auto;border:1px solid #e0e0e0;border-radius:6px;padding:8px"><div th:each="poi:${allPois}" style="padding:6px;display:flex;align-items:center;gap:8px"><input type="checkbox" name="poiCheckbox" th:value="${poi.id}" th:checked="${route.poiIds != null and #strings.contains(route.poiIds,''+poi.id)}" onchange="updatePois()"/><span th:text="${poi.name}"></span><small th:text="'('+${poi.category}+')'" style="color:#999"></small></div></div><input type="hidden" name="selectedPois" id="selectedPois" th:value="${route.poiIds}"/></div>
<div class="form-group"><label>Статус</label><select class="form-control" th:field="*{published}"><option value="false">Черновик</option><option value="true">Опубликован</option></select></div>
<div class="form-actions" style="position:sticky;bottom:0;background:var(--gray-800);z-index:2;">
<button type="submit" class="btn btn-primary" style="margin-left:auto">💾 Сохранить</button><a th:href="@{/admin/routes}" class="btn btn-ghost">Отмена</a></div>
</form></div></main></div><script>function updatePois(){const c=document.querySelectorAll('input[name="poiCheckbox"]:checked');document.getElementById('selectedPois').value=Array.from(c).map(x=>x.value).join(',');}</script></body></html>
