<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head(${isEdit}?'Редактирование':'Новый маршрут')}"></head><body class="astra-app"><div class="layout"><nav th:replace="~{fragments/layout :: sidebar}"></nav><main class="main-content">
<div class="page-header"><h1 th:text="${isEdit}?'✏️ Редактирование маршрута':'🚶 Новый маршрут'"></h1><a th:href="@{/admin/routes}" class="btn">← Назад</a></div>
<div style="display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px;align-items:start">
<div class="card"><form id="routeForm" th:action="@{/admin/routes/save}" method="post" enctype="multipart/form-data" th:object="${route}"><input type="hidden" th:field="*{id}"/><input type="hidden" th:name="${_csrf != null ? _csrf.parameterName : '_csrf'}" th:value="${_csrf != null ? _csrf.token : ''}"/>
<h3>Основное</h3><div class="form-group"><label>Название *</label><input type="text" class="form-control" th:field="*{name}" required/></div><div class="form-group"><label>Описание</label><textarea class="form-control" th:field="*{description}" rows="3"></textarea></div><div class="form-row"><div class="form-group"><label>Категория</label><select class="form-control" th:field="*{category}"><option value="">—</option><option value="История">История</option><option value="Архитектура">Архитектура</option><option value="Культура">Культура</option><option value="Природа">Природа</option></select></div><div class="form-group"><label>Сложность</label><select class="form-control" th:field="*{difficulty}"><option value="easy">Лёгкий</option><option value="medium">Средний</option><option value="hard">Сложный</option></select></div></div>
<h3 style="margin:24px 0 16px">Параметры</h3><div class="form-row"><div class="form-group"><label>Дистанция (км)</label><input type="number" step="0.1" class="form-control" th:field="*{distance}"/></div><div class="form-group"><label>Длительность (мин)</label><input type="number" class="form-control" th:field="*{duration}"/></div></div>
<h3 style="margin:24px 0 16px">Монетизация</h3><div class="form-row"><div class="form-group"><label>Платный</label><select id="paidSelect" class="form-control" th:field="*{paid}"><option value="false">Нет</option><option value="true">Да</option></select></div><div class="form-group"><label>Цена (₽)</label><input id="priceInput" type="number" step="0.01" class="form-control" th:field="*{price}"/></div></div><p id="routeFormError" style="display:none;color:#d66;font-size:12px"></p>
<h3 style="margin:24px 0 16px">Медиа</h3><div class="form-group"><label>Изображение</label><input type="file" class="form-control" name="imageFile" accept="image/*"/></div>
<h3 style="margin:24px 0 16px">Точки маршрута</h3><div class="form-group"><label>Выберите точки и задайте порядок:</label><div style="max-height:200px;overflow-y:auto;border:1px solid #e0e0e0;border-radius:6px;padding:8px"><div th:each="poi:${allPois}" style="padding:6px;display:flex;align-items:center;gap:8px"><input type="checkbox" name="poiCheckbox" th:value="${poi.id}" th:checked="${route.poiIds != null and #strings.contains(route.poiIds,''+poi.id)}" onchange="updatePois()"/><span th:text="${poi.name}"></span><small th:text="'('+${poi.category}+')'" style="color:#999"></small></div></div><input type="hidden" name="selectedPois" id="selectedPois" th:value="${route.poiIds}"/></div>
<div class="form-group"><label>Порядок точек (drag-and-drop fallback):</label><ul id="poiOrderList" style="list-style:none;padding:0;margin:0"></ul></div>
<div class="form-group"><label>Таймлайн маршрута (preview)</label><div id="routeTimelinePreview" style="font-size:12px;color:#aaa"></div></div>
<div class="form-group"><label>Статус</label><select id="publishedField" class="form-control" th:field="*{published}"><option value="false">Черновик</option><option value="true">Опубликован</option></select></div>
<div class="form-actions" style="position:sticky;bottom:0;background:var(--gray-800);z-index:2;"><button type="button" class="btn btn-ghost" onclick="saveDraft()">Сохранить как черновик</button><button type="button" class="btn btn-primary" onclick="saveAndPublish()">Сохранить и опубликовать</button><a th:href="@{/admin/routes}" class="btn btn-ghost">Отмена</a></div>
</form></div>
<aside class="card" style="position:sticky;top:16px;padding:12px">
  <h3 style="margin-top:0">Сводка заполнения</h3>
  <div id="routeSummary" style="font-size:12px;color:#bbb;line-height:1.6"></div>
  <div style="margin-top:10px;padding-top:10px;border-top:1px solid #333">
    <h4 style="margin:0 0 6px 0;font-size:13px">Preview карточки</h4>
    <div id="routePreview" style="border:1px solid #333;border-radius:8px;padding:10px;font-size:12px">
      <p id="pvRouteName" style="margin:0 0 4px 0;font-weight:600">Маршрут</p>
      <p id="pvRouteMeta" style="margin:0;color:#999">Категория · длительность · дистанция</p>
      <p id="pvRoutePrice" style="margin:6px 0 0 0;color:#c8a96e">Бесплатно</p>
    </div>
  </div>
</aside>
</div></main></div>
<script>
function selectedPoiIds(){return Array.from(document.querySelectorAll('input[name="poiCheckbox"]:checked')).map(x=>x.value)}
function updatePois(){const ids=selectedPoiIds();document.getElementById('selectedPois').value=ids.join(',');renderPoiOrder(ids);renderTimeline(ids)}
function renderPoiOrder(ids){const ul=document.getElementById('poiOrderList');ul.innerHTML='';ids.forEach((id,idx)=>{const li=document.createElement('li');li.style.cssText='display:flex;gap:8px;align-items:center;padding:4px 0';li.innerHTML=`<span style="min-width:18px">${idx+1}.</span><code>${id}</code><button type="button" onclick="movePoi(${idx},-1)">↑</button><button type="button" onclick="movePoi(${idx},1)">↓</button>`;ul.appendChild(li)})}
function movePoi(idx,dir){const ids=selectedPoiIds();const ni=idx+dir;if(ni<0||ni>=ids.length)return;const t=ids[idx];ids[idx]=ids[ni];ids[ni]=t;document.querySelectorAll('input[name="poiCheckbox"]').forEach(c=>c.checked=false);ids.forEach(id=>{const el=document.querySelector(`input[name="poiCheckbox"][value="${id}"]`);if(el)el.checked=true});updatePois()}
function renderTimeline(ids){document.getElementById('routeTimelinePreview').textContent=ids.length?ids.map((id,i)=>`${i+1}. POI #${id}`).join('  →  '):'Добавьте точки маршрута'}
document.getElementById('routeForm').addEventListener('submit',(e)=>{const paid=document.getElementById('paidSelect').value==='true';const price=Number(document.getElementById('priceInput').value||0);const err=document.getElementById('routeFormError');if(paid&&(!Number.isFinite(price)||price<=0)){e.preventDefault();err.style.display='block';err.textContent='Для платного маршрута цена обязательна и должна быть больше 0.';return}err.style.display='none'})
function saveDraft(){document.getElementById('publishedField').value='false';document.getElementById('routeForm').requestSubmit()}
function saveAndPublish(){document.getElementById('publishedField').value='true';document.getElementById('routeForm').requestSubmit()}
function updateRouteSummary(){const name=document.querySelector('[name="name"]')?.value?.trim();const category=document.querySelector('[name="category"]')?.value?.trim();const duration=document.querySelector('[name="duration"]')?.value?.trim();const price=Number(document.getElementById('priceInput')?.value||0);const paid=document.getElementById('paidSelect')?.value==='true';const ids=selectedPoiIds();const required=[['Название','[name="name"]',!!name],['Категория','[name="category"]',!!category],['Точки маршрута','#selectedPois',ids.length>0],['Цена (для платного)','#priceInput',!paid||price>0]];const out=required.map(r=>`${r[2]?'✅':'❌'} <a href="javascript:void(0)" onclick="document.querySelector('${r[1]}')?.scrollIntoView({behavior:'smooth',block:'center'})" style="color:${r[2]?'#8a8':'#d88'}">${r[0]}</a>`).join('<br>');document.getElementById('routeSummary').innerHTML=out;document.getElementById('pvRouteName').textContent=name||'Маршрут';document.getElementById('pvRouteMeta').textContent=`${category||'Без категории'} · ${duration||'—'} мин · ${document.querySelector('[name="distance"]')?.value||'—'} км`;document.getElementById('pvRoutePrice').textContent=paid?`Платно: ${price||0} ₽`:'Бесплатно'}
document.querySelectorAll('#routeForm input,#routeForm select,#routeForm textarea').forEach(el=>el.addEventListener('input',updateRouteSummary))
document.querySelectorAll('#routeForm input,#routeForm select,#routeForm textarea').forEach(el=>el.addEventListener('change',updateRouteSummary))
updatePois();
updateRouteSummary();
</script></body></html>
