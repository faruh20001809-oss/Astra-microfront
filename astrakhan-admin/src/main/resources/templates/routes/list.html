<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Маршруты')}"></head><body class="astra-app"><div class="layout"><nav th:replace="~{fragments/layout :: sidebar}"></nav><main class="main-content">
<div class="page-header"><h1>🚶 Маршруты</h1><a th:href="@{/admin/routes/create}" class="btn btn-primary">+ Добавить</a></div>
<div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
<div class="card"><table><thead><tr><th>ID</th><th>Название</th><th>Категория</th><th>Дистанция</th><th>Длительность</th><th>Сложность</th><th>Рейтинг</th><th>Платный</th><th>Статус</th><th>Действия</th></tr></thead><tbody>
<tr th:each="r : ${routes}"><td th:text="${r.id}"></td><td><strong th:text="${r.name}"></strong><br/><small th:text="${#strings.abbreviate(r.description,60)}" style="color:#999"></small></td><td th:text="${r.category}"></td><td th:text="${r.distance != null ? r.distance + ' км' : '—'}"></td><td th:text="${r.duration != null ? r.duration + ' мин' : '—'}"></td><td th:text="${r.difficulty}"></td><td><span class="rating" th:text="${r.rating != null ? '★ '+r.rating : '—'}"></span></td><td th:text="${r.paid ? r.price + ' ₽' : 'Бесплатно'}"></td><td><span class="status-badge" th:classappend="${r.published ? 'status-published' : 'status-draft'}" th:text="${r.published ? 'Опубликован' : 'Черновик'}"></span></td>
<td><div class="btn-group"><a th:href="@{'/admin/routes/edit/'+${r.id}}" class="btn btn-sm">✏️</a><form th:if="${!r.published}" th:action="@{'/admin/routes/publish/'+${r.id}}" method="post" style="display:inline"><button class="btn btn-sm btn-success">📤</button></form><form th:if="${r.published}" th:action="@{'/admin/routes/unpublish/'+${r.id}}" method="post" style="display:inline"><button class="btn btn-sm btn-warning">📥</button></form><form th:action="@{'/admin/routes/delete/'+${r.id}}" method="post" style="display:inline" onsubmit="return confirm('Удалить?')"><button class="btn btn-sm btn-danger">🗑️</button></form></div></td></tr>
<tr th:if="${#lists.isEmpty(routes)}"><td colspan="10" style="text-align:center;padding:40px;color:#999">Нет маршрутов</td></tr></tbody></table></div></main></div></body></html>
