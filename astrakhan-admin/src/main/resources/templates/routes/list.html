<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Маршруты')}"></head><body class="astra-app"><div class="layout"><nav th:replace="~{fragments/layout :: sidebar}"></nav><main class="main-content">
<div class="page-header"><h1>Маршруты</h1><a th:href="@{/admin/routes/create}" class="btn btn-primary">+ Добавить</a></div>
<div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
<div class="card"><div class="table-responsive"><table aria-label="Список маршрутов"><thead><tr><th>ID</th><th>Название</th><th>Категория</th><th>Дистанция</th><th>Длительность</th><th>Сложность</th><th>Рейтинг</th><th>Платный</th><th>Статус</th><th>Действия</th></tr></thead><tbody>
<tr th:each="r : ${routes}"><td th:text="${r.id}"></td><td><strong th:text="${r.name}"></strong><br/><small class="table-cell-muted" th:text="${r.description != null ? #strings.abbreviate(r.description, 60) : ''}"></small></td><td th:text="${r.category}"></td><td th:text="${r.distance != null ? r.distance + ' км' : '—'}"></td><td th:text="${r.duration != null ? r.duration + ' мин' : '—'}"></td><td th:text="${r.difficulty}"></td><td><span class="rating" th:text="${r.rating != null ? '★ '+r.rating : '—'}"></span></td><td th:text="${r.paid ? r.price + ' ₽' : 'Бесплатно'}"></td><td><span class="status-badge" th:classappend="${r.published ? 'status-published' : 'status-draft'}" th:text="${r.published ? 'Опубликован' : 'Черновик'}"></span></td>
<td><div class="btn-group"><a th:href="@{'/admin/routes/edit/'+${r.id}}" class="btn btn-sm" aria-label="Редактировать">Изм.</a><form th:if="${!r.published}" th:action="@{'/admin/routes/publish/'+${r.id}}" method="post" class="form-inline"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/><button type="submit" class="btn btn-sm btn-success" aria-label="Опубликовать">Опубл.</button></form><form th:if="${r.published}" th:action="@{'/admin/routes/unpublish/'+${r.id}}" method="post" class="form-inline"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/><button type="submit" class="btn btn-sm btn-warning" aria-label="Снять с публикации">Снять</button></form><form th:action="@{'/admin/routes/delete/'+${r.id}}" method="post" class="form-inline" onsubmit="return confirm('Удалить?')"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/><button type="submit" class="btn btn-sm btn-danger" aria-label="Удалить">Удал.</button></form></div></td></tr>
<tr th:if="${#lists.isEmpty(routes)}" class="table-empty-row"><td colspan="10">Нет маршрутов</td></tr></tbody></table></div></div></main></div></body></html>
