<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Обратная связь')}"></head><body><div class="layout"><nav th:replace="~{fragments/layout :: sidebar}"></nav><main class="main-content">
<div class="page-header"><h1>💬 Обратная связь</h1><span th:if="${newCount > 0}" class="status-badge status-new" th:text="'Новых: '+${newCount}"></span></div>
<div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
<div class="filter-bar"><a th:href="@{/admin/feedback}" class="btn" th:classappend="${currentStatus==null?'active':''}">Все</a><a th:href="@{/admin/feedback(status='NEW')}" class="btn" th:classappend="${currentStatus=='NEW'?'active':''}">Новые</a><a th:href="@{/admin/feedback(status='READ')}" class="btn" th:classappend="${currentStatus=='READ'?'active':''}">Прочитанные</a><a th:href="@{/admin/feedback(status='RESPONDED')}" class="btn" th:classappend="${currentStatus=='RESPONDED'?'active':''}">С ответом</a><a th:href="@{/admin/feedback(status='ARCHIVED')}" class="btn" th:classappend="${currentStatus=='ARCHIVED'?'active':''}">Архив</a></div>
<div class="card"><table><thead><tr><th>ID</th><th>Имя</th><th>Email</th><th>Тема</th><th>Сообщение</th><th>Статус</th><th>Дата</th><th>Действия</th></tr></thead><tbody>
<tr th:each="fb : ${feedbacks}"><td th:text="${fb.id}"></td><td th:text="${fb.name}"></td><td><small th:text="${fb.email}"></small></td><td th:text="${fb.subject}"></td><td th:text="${#strings.abbreviate(fb.message,60)}"></td><td><span class="status-badge" th:classappend="'status-'+${fb.status.name().toLowerCase()}" th:text="${fb.status.name()}"></span></td><td th:text="${#temporals.format(fb.createdAt,'dd.MM.yyyy HH:mm')}"></td><td><div class="btn-group"><a th:href="@{'/admin/feedback/view/'+${fb.id}}" class="btn btn-sm">👁️</a><form th:action="@{'/admin/feedback/archive/'+${fb.id}}" method="post" style="display:inline"><button class="btn btn-sm btn-warning">📥</button></form></div></td></tr>
<tr th:if="${#lists.isEmpty(feedbacks)}"><td colspan="8" style="text-align:center;padding:40px;color:#999">Нет обращений</td></tr></tbody></table></div></main></div></body></html>
