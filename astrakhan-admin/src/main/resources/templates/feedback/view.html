<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Обращение #'+${feedback.id})}"></head><body class="astra-app"><div class="layout"><nav th:replace="~{fragments/layout :: sidebar}"></nav><main class="main-content">
<div class="page-header"><h1 th:text="'💬 Обращение #'+${feedback.id}"></h1><a th:href="@{/admin/feedback}" class="btn">← Назад</a></div>
<div class="grid-2"><div class="card"><div class="card-header"><h3>Обращение</h3></div>
<div class="detail-row"><div class="detail-label">Имя</div><div class="detail-value" th:text="${feedback.name}"></div></div>
<div class="detail-row"><div class="detail-label">Email</div><div class="detail-value" th:text="${feedback.email}"></div></div>
<div class="detail-row" th:if="${feedback.phone}"><div class="detail-label">Телефон</div><div class="detail-value" th:text="${feedback.phone}"></div></div>
<div class="detail-row"><div class="detail-label">Тема</div><div class="detail-value" th:text="${feedback.subject}"></div></div>
<div class="detail-row"><div class="detail-label">Статус</div><div class="detail-value"><span class="status-badge" th:classappend="'status-'+${feedback.status.name().toLowerCase()}" th:text="${feedback.status.name()}"></span></div></div>
<div style="margin-top:16px;padding:16px;background:#f8f8f8;border-radius:6px"><p th:text="${feedback.message}"></p></div></div>
<div class="card"><div class="card-header"><h3>Ответ</h3></div>
<div th:if="${feedback.adminResponse}" style="margin-bottom:16px;padding:16px;background:#d4edda;border-radius:6px"><p th:text="${feedback.adminResponse}"></p><small th:if="${feedback.respondedAt}" th:text="'Отвечено: '+${#temporals.format(feedback.respondedAt,'dd.MM.yyyy HH:mm')}" style="color:#999"></small></div>
<form th:action="@{'/admin/feedback/respond/'+${feedback.id}}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/><div class="form-group"><label>Ваш ответ</label><textarea name="response" class="form-control" rows="5" required></textarea></div><button type="submit" class="btn btn-primary">📤 Отправить</button></form></div></div></main></div></body></html>
