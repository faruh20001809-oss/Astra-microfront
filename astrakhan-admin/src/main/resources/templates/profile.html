<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Профиль')}"></head>
<body>
<div class="layout">
    <nav th:replace="~{fragments/layout :: sidebar}"></nav>
    <main class="main-content">
        <div class="page-header">
            <h1>Профиль</h1>
            <a th:href="@{/admin}" class="btn">← Назад</a>
        </div>
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <div class="card" style="max-width: 480px;">
            <div class="card-header"><h3>Смена пароля</h3></div>
            <p class="text-muted" style="margin-bottom: 1rem;">Вы вошли как <strong th:text="${user.username}"></strong></p>
            <form th:action="@{/admin/profile/change-password}" method="post">
                <div class="form-group">
                    <label for="currentPassword">Текущий пароль</label>
                    <input id="currentPassword" name="currentPassword" type="password" class="form-control" required autocomplete="current-password"/>
                </div>
                <div class="form-group">
                    <label for="newPassword">Новый пароль</label>
                    <input id="newPassword" name="newPassword" type="password" class="form-control" required minlength="4" autocomplete="new-password"/>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Повторите новый пароль</label>
                    <input id="confirmPassword" name="confirmPassword" type="password" class="form-control" required minlength="4" autocomplete="new-password"/>
                </div>
                <button type="submit" class="btn btn-primary">Изменить пароль</button>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            </form>
        </div>
    </main>
</div>
</body>
</html>
