<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Новый пользователь')}"></head>
<body class="astra-app">
<div class="layout">
<nav th:replace="~{fragments/layout :: sidebar}"></nav>
<main class="main-content">
<div class="page-header"><h1>👤 Новый пользователь</h1><a th:href="@{/admin/users}" class="btn">← Назад</a></div>
<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
<div class="card">
<form th:action="@{/admin/users}" method="post">
  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
  <h3>Основное</h3>
  <div class="form-group"><label>Логин *</label><input type="text" name="username" class="form-control" required placeholder="Логин для входа в админку"/></div>
  <div class="form-group"><label>Пароль *</label><input type="password" name="password" class="form-control" required placeholder="Пароль"/></div>

  <h3 style="margin-top:24px">Роль</h3>
  <div class="form-group"><label>Роль</label><select name="role" class="form-control"><option value="ADMIN">ADMIN</option><option value="MANAGER">MANAGER</option><option value="VIEWER">VIEWER</option></select></div>

  <div class="form-actions" style="position:sticky;bottom:0;background:var(--gray-800);z-index:2;">
    <button type="submit" class="btn btn-primary" style="margin-left:auto">💾 Создать</button>
    <a th:href="@{/admin/users}" class="btn btn-ghost">Отмена</a>
  </div>
</form>
</div>
</main></div></body></html>
