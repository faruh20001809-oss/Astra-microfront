<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Пользователи')}"></head>
<body class="astra-app">
<div class="layout">
<nav th:replace="~{fragments/layout :: sidebar}"></nav>
<main class="main-content">
<div class="page-header"><h1>👤 Пользователи админки</h1><a th:href="@{/admin/users/new}" class="btn btn-primary">+ Добавить пользователя</a></div>
<div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
<div class="card">
<table>
<thead><tr><th>ID</th><th>Логин</th><th>Роль</th><th>Создан</th><th>Действия</th></tr></thead>
<tbody>
<tr th:each="u : ${users}">
  <td th:text="${u.id}"></td>
  <td><strong th:text="${u.username}"></strong><span th:if="${u.username == currentUsername}" class="status-badge status-published" style="margin-left:6px;">вы</span></td>
  <td th:text="${u.role}"></td>
  <td th:text="${u.createdAt != null ? #temporals.format(u.createdAt, 'dd.MM.yyyy HH:mm') : '—'}"></td>
  <td>
    <div class="btn-group">
      <a th:href="@{'/admin/users/edit/'+${u.id}}" class="btn btn-sm">✏️ Изменить пароль</a>
      <form th:if="${#lists.size(users) > 1}" th:action="@{'/admin/users/delete/'+${u.id}}" method="post" style="display:inline" onsubmit="return confirm('Удалить пользователя?');">
        <button type="submit" class="btn btn-sm btn-danger">🗑️</button>
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      </form>
    </div>
  </td>
</tr>
<tr th:if="${#lists.isEmpty(users)}"><td colspan="5" style="text-align:center;padding:40px;color:#999">Нет пользователей</td></tr>
</tbody>
</table>
</div>
</main></div></body></html>
