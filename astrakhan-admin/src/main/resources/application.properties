server.port=8080
# H2 file — один подключённый клиент. DBeaver: только когда приложение выключено. При запущенном приложении: http://localhost:8080/h2-console
spring.datasource.url=jdbc:h2:file:./data/astrakhan_db;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.thymeleaf.cache=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.module2.url=http://localhost:3000
# Абсолютный URL Java API для ссылок «отписаться» в письмах (в проде — публичный хост бэкенда)
app.api.public.base-url=http://localhost:8080

# LLM в админке (описание ТОИ, анализ фото). Ключ только на сервере: APP_AI_API_KEY
app.ai.enabled=${APP_AI_ENABLED:false}
app.ai.api-key=${APP_AI_API_KEY:}
app.ai.base-url=${APP_AI_BASE_URL:https://api.openai.com/v1}
app.ai.model=${APP_AI_MODEL:gpt-4o-mini}
app.ai.vision-model=${APP_AI_VISION_MODEL:gpt-4o-mini}
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.time-zone=Europe/Moscow
# ??????????? SQL (??? ???????)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Mail (SMTP). Для продакшена задайте переменные окружения или раскомментируйте и укажите свои значения.
# Примеры: Yandex (smtp.yandex.ru:465), Mail.ru (smtp.mail.ru:465), Gmail (smtp.gmail.com:587), SendGrid, Mailtrap (для тестов).
spring.mail.host=${SPRING_MAIL_HOST:smtp.example.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Адрес отправителя (должен быть разрешён на вашем SMTP-сервере)
app.mail.from=${APP_MAIL_FROM:noreply@astrakhan-history.local}
# Включить отправку писем (false — только логировать, не отправлять)
app.mail.enabled=${APP_MAIL_ENABLED:true}

# Online payment (stub). For production: set provider (yookassa, robokassa, etc.) and credentials.
app.payment.enabled=true
app.payment.provider=stub
# app.payment.shopId=
# app.payment.secretKey=
# app.payment.returnUrlTemplate=${app.module2.url}/payment/success
# app.payment.cancelUrlTemplate=${app.module2.url}/payment/cancel

# Telegram integration (deep-link bind + order notifications)
app.telegram.bot-username=${APP_TELEGRAM_BOT_USERNAME:}
app.telegram.link-ttl-sec=${APP_TELEGRAM_LINK_TTL_SEC:900}
app.telegram.internal-token=${TELEGRAM_INTERNAL_TOKEN:}
app.telegram.notifications.enabled=${APP_TELEGRAM_NOTIFICATIONS_ENABLED:false}
app.telegram.bot-service-url=${APP_TELEGRAM_BOT_SERVICE_URL:http://localhost:8090}