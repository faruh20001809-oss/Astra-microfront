name: Lint

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  module2-check:
    name: module2 (build check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: module2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: module2/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  admin-check:
    name: astrakhan-admin (compile check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: astrakhan-admin
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Compile
        run: mvn -B -DskipTests compile

  module3-check:
    name: module3 (python syntax check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: module3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: |
          python -m py_compile app.py
          python -m py_compile telegram_bot.py
          python -m py_compile metrics_utils.py
          python -m py_compile telegram_utils.py
