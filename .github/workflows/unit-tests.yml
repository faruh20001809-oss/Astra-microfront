name: Unit Tests

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  module2-tests:
    name: module2 (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: module2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: module2/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm run test:run

  admin-tests:
    name: astrakhan-admin (maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: astrakhan-admin
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run tests
        run: mvn -B test

  module3-tests:
    name: module3 (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: module3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run tests
        run: pytest -q
