# Фрагмент для Nginx: статика фронта + прокси к Spring Boot
# Домен VM: 152665.ip-ptr.tech (IP 193.233.49.59)
# Маршруты: / — основной фронт, /workflow — Java для сотрудников, /admin — админка, /java-api — API
# Разместить в /etc/nginx/sites-available/astramicro и включить sites-enabled

server {
    listen 80 default_server;
    server_name 152665.ip-ptr.tech _;
    root /opt/astramicro/module2/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Java-приложение для сотрудников (логин и т.д.): в браузере будет /workflow/...
    location /workflow/ {
        rewrite ^/workflow(.*)$ /java-api$1 break;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect /java-api/admin/ /admin/;
        proxy_redirect /java-api/ /workflow/;
    }

    # Админка (module3 — Flask: пользователи, роли, метрики, отчёты). Пример: http://152665.ip-ptr.tech/admin/
    location /admin/ {
        rewrite ^/admin(.*)$ $1 break;
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /admin;
    }

    # API для основного фронта (module2)
    location /java-api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
