# Фрагмент для Nginx: статика фронта + прокси к Spring Boot
# Доступ по IP: 193.233.49.59 (домен подставить после покупки)
# Маршруты: / — основной фронт, /workflow — Java для сотрудников, /admin — админка, /java-api — API
# Разместить в /etc/nginx/sites-available/astramicro и включить sites-enabled

server {
    listen 80 default_server;
    server_name 193.233.49.59 _;
    root /opt/astramicro/module2/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Java-приложение для сотрудников (логин и т.д.): в браузере будет /workflow/...
    location /workflow/ {
        rewrite ^/workflow(.*)$ /java-api$1 break;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect /java-api/admin/ /admin/;
        proxy_redirect /java-api/ /workflow/;
    }

    # Админка (module3 — Flask: пользователи, роли, метрики, отчёты). Пример: http://193.233.49.59/admin/
    # 504 Gateway Timeout = сервис astramicro-admin не отвечает на 127.0.0.1:5000 → systemctl start astramicro-admin
    location /admin/ {
        rewrite ^/admin(.*)$ $1 break;
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /admin;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # API для основного фронта (module2): убираем префикс /java-api, бэкенд ждёт /api/v1/...
    location /java-api/ {
        rewrite ^/java-api(.*)$ $1 break;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
    }

    # PDF-отчёты и прочие /api/reports/* — Flask (module3). Иначе общий location /api/ уходит на Node (3001): POST даст 405.
    location ^~ /api/reports/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Node.js API (module2): карта, AI, TTS — POST /api/node/ai/tts и др.
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
