# Фрагмент для Nginx: статика фронта + прокси к Spring Boot
# Подставить свой путь FRONTEND_ROOT (например /opt/astramicro/module2/dist)
# Разместить в /etc/nginx/sites-available/astramicro и включить sites-enabled

server {
    listen 80 default_server;
    server_name _;
    root /opt/astramicro/module2/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /java-api/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
